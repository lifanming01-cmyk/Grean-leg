<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>绿色小人·不可能的阶梯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;overflow:hidden;font-family:'Arial',sans-serif}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
const GW=420,GH=760;
let sc=1;
function resize(){
  const r1=innerWidth/innerHeight,r2=GW/GH;
  sc=r1<r2?innerWidth/GW:innerHeight/GH;
  C.width=GW*sc;C.height=GH*sc;
  X.setTransform(sc,0,0,sc,0,0);
}
resize();addEventListener('resize',resize);

// ===== 等轴测投影 =====
const T=48;
function iso(gx,gy,gz){
  const px=(gx-gy)*T*0.866;
  const py=(gx+gy)*T*0.5 - gz*T*0.75;
  return {x:GW/2+px, y:GH*0.72+py};
}

// ===== 状态 =====
const ST={MENU:0,PLAY:1,OVER:2};
let state=ST.MENU,score=0,best=+localStorage.getItem('isoBest2')||0;
let pressed=false,gt=0,camOff={x:0,y:0},camTgt={x:0,y:0};
let shakeT=0,particles=[],floats=[];

// ===== 平台 =====
let plats=[];
let cur=0; // 当前平台

// 角色
const P={
  rx:0,ry:0,rz:0,
  moving:false,legA:0,bodyB:0,
  blink:0,blinkT:0,facing:1,
  hurt:false,hurtT:0,invT:0,
  combo:0,comboT:0,
  falling:false,fallV:0
};

// ===== 核心修复：保证路径 100% 可达 =====
function genPlats(){
  plats=[];
  // 起始大平台
  plats.push({gx:0,gy:0,gz:0,w:2,d:2,type:'start',alive:true,
    crumT:0,fOff:0,visited:true,star:false,starGot:false,
    obs:null,obsAct:true,opacity:1,idx:0});

  let cx=0,cy=0,cz=0;

  for(let i=1;i<300;i++){
    const diff=Math.min(i/60,1);
    
    // 方向：只向右(+x)或向前(+y)走，保证路径单向可达
    // 偶尔上下台阶
    let dx,dy,dz=0;
    
    // 交替方向，形成Z字形好看的路径
    const pattern = Math.floor((i-1)/3) % 4; // 每3步换方向
    if(pattern === 0 || pattern === 1){
      // 向右走
      dx=1; dy=0;
    } else {
      // 向前走
      dx=0; dy=1;
    }

    // 加入一些变化（但保证间距=1，一定能到达）
    if(i > 10 && Math.random()<0.2*diff){
      // 对角一步
      dx=1;dy=1;
    }

    // 高度变化 - 上下台阶
    if(Math.random()<0.3){
      dz = Math.random()<0.65 ? 1 : -1;
      if(cz+dz < -3) dz=1;
      if(cz+dz > 15) dz=-1;
    }

    cx+=dx; cy+=dy; cz+=dz;

    // 平台尺寸
    let w=1,d=1;
    let type='normal';
    let star = Math.random()<0.15;
    let obs = null;

    // 特殊平台
    if(i>6){
      const r=Math.random();
      if(r<0.06*diff){
        type='crumble'; // 碎裂
      } else if(r<0.12*diff){
        type='float'; // 漂浮
      } else if(r<0.18*diff && i>15){
        type='illusion'; // 视错觉
        w=2;d=1;
      } else if(r<0.24*diff && i>20){
        type='fold'; // 空间折叠
        w=2;d=2;
        // 折叠跳远 - 下一个平台会离得远但也一定可达
      } else if(r<0.28*diff && i>25){
        type='penrose'; // 彭罗斯
      }
      
      // 有时加宽
      if(type==='normal' && Math.random()<0.15) { w=2; }
      if(type==='normal' && Math.random()<0.12) { d=2; }
    }

    // 障碍物（不在特殊平台上）
    if(i>8 && type==='normal' && Math.random()<0.1*diff){
      obs = Math.random()<0.5?'spike':'block';
    }

    plats.push({
      gx:cx,gy:cy,gz:cz,w,d,type,alive:true,
      crumT:0, fOff:Math.random()*Math.PI*2,
      visited:false, star, starGot:false,
      obs, obsAct:true, opacity:1, idx:i
    });
  }
}

// ===== 主题 =====
const THEMES=[
  {top:'#f0e6d3',left:'#c8b498',right:'#b09878',accent:'#e8967a',sky1:'#2c1e3a',sky2:'#1a1230'},
  {top:'#d5e8d4',left:'#94b892',right:'#78a076',accent:'#6b9e6b',sky1:'#1a2e1a',sky2:'#0e1e0e'},
  {top:'#dae2f8',left:'#9aaac8',right:'#7e90b0',accent:'#6c7eb7',sky1:'#1a1e3a',sky2:'#0e1228'},
  {top:'#f0d0d8',left:'#c89098',right:'#b07880',accent:'#b06070',sky1:'#2e1a22',sky2:'#1e0e16'},
  {top:'#e0d8f0',left:'#a898c8',right:'#9080b0',accent:'#8b6aae',sky1:'#201a30',sky2:'#140e22'},
];
function getTheme(idx){ return THEMES[Math.floor(idx/20)%THEMES.length]; }

// ===== 绘制等轴方块 =====
function drawCube(cx,cy,w,d,h,tc,lc,rc,alpha){
  const a=0.866, b=0.5;
  const hw=w*T*a, hd=d*T*a;
  const sw=w*T*b, sd=d*T*b;
  const rise=h*T*0.75;

  X.save();
  if(alpha!==undefined) X.globalAlpha=alpha;

  // 顶面
  X.beginPath();
  X.moveTo(cx, cy);
  X.lineTo(cx+hw, cy+sw);
  X.lineTo(cx+hw-hd, cy+sw+sd);
  X.lineTo(cx-hd, cy+sd);
  X.closePath();
  X.fillStyle=tc; X.fill();
  X.strokeStyle='rgba(0,0,0,0.1)';X.lineWidth=0.8;X.stroke();

  // 左面
  X.beginPath();
  X.moveTo(cx-hd, cy+sd);
  X.lineTo(cx+hw-hd, cy+sw+sd);
  X.lineTo(cx+hw-hd, cy+sw+sd+rise);
  X.lineTo(cx-hd, cy+sd+rise);
  X.closePath();
  X.fillStyle=lc; X.fill();
  X.strokeStyle='rgba(0,0,0,0.08)';X.stroke();

  // 右面
  X.beginPath();
  X.moveTo(cx+hw, cy+sw);
  X.lineTo(cx+hw-hd, cy+sw+sd);
  X.lineTo(cx+hw-hd, cy+sw+sd+rise);
  X.lineTo(cx+hw, cy+sw+rise);
  X.closePath();
  X.fillStyle=rc; X.fill();
  X.strokeStyle='rgba(0,0,0,0.08)';X.stroke();

  X.restore();
}

// ===== 绘制平台 =====
function drawPlat(p,cx,cy){
  if(!p.alive) return;
  let gz=p.gz;
  if(p.type==='float') gz+=Math.sin(gt*1.5+p.fOff)*0.3;

  const pos=iso(p.gx,p.gy,gz);
  const sx=pos.x-cx, sy=pos.y-cy;
  if(sx<-180||sx>GW+180||sy<-180||sy>GH+180) return;

  let alpha=p.opacity;
  if(p.type==='crumble'&&p.crumT>0){
    alpha=Math.max(0,1-p.crumT/40);
    if(p.crumT>40){p.alive=false;return;}
  }

  const t=getTheme(p.idx);
  let tc=t.top, lc=t.left, rc=t.right;

  // 特殊类型颜色
  if(p.type==='illusion'){ tc='#dcc8ff';lc='#b090d8';rc='#9878c0'; }
  else if(p.type==='fold'){ tc='#ffe0b0';lc='#d8a860';rc='#c89040'; }
  else if(p.type==='penrose'){ tc='#b8e8f0';lc='#80c0c8';rc='#60a0a8'; }
  else if(p.type==='crumble'){ tc='#ffc8c8';lc='#d89090';rc='#c07878'; }

  // 当前平台亮一点
  if(p.idx===cur) { tc=lighten(tc,25); }
  // 下一个平台脉冲
  if(p.idx===cur+1){
    const pulse=Math.sin(gt*4)*0.12+0.88;
    alpha*=pulse;
    // 额外发光提示
    X.save();
    X.globalAlpha=0.2+Math.sin(gt*4)*0.1;
    const glow=X.createRadialGradient(sx,sy,5,sx,sy,35);
    glow.addColorStop(0,'rgba(255,255,200,0.4)');
    glow.addColorStop(1,'rgba(255,255,200,0)');
    X.fillStyle=glow;
    X.beginPath();X.arc(sx,sy,35,0,Math.PI*2);X.fill();
    X.restore();
  }

  const pillar=0.5;
  drawCube(sx,sy,p.w,p.d,pillar,tc,lc,rc,alpha);

  // 视错觉桥梁
  if(p.type==='illusion'&&p.idx>0){
    const prev=plats[p.idx-1];
    if(prev){
      const pp=iso(prev.gx,prev.gy,prev.gz);
      X.save();
      X.globalAlpha=0.3+Math.sin(gt*3)*0.15;
      X.setLineDash([5,5]);
      X.strokeStyle='#c080ff';X.lineWidth=2.5;
      X.beginPath();
      X.moveTo(pp.x-cx,pp.y-cy);
      const mx2=(pp.x-cx+sx)/2, my2=(pp.y-cy+sy)/2-30;
      X.quadraticCurveTo(mx2,my2,sx,sy);
      X.stroke();X.setLineDash([]);
      // 粒子
      for(let j=0;j<4;j++){
        const tt=(gt*0.4+j*0.25)%1;
        const bx2=pp.x-cx+(sx-(pp.x-cx))*tt;
        const by2=pp.y-cy+(sy-(pp.y-cy))*tt-Math.sin(tt*Math.PI)*30;
        X.fillStyle=`rgba(200,128,255,${0.5-tt*0.5})`;
        X.beginPath();X.arc(bx2,by2,2.5,0,Math.PI*2);X.fill();
      }
      X.restore();
    }
  }

  // 空间折叠传送门
  if(p.type==='fold'){
    X.save();
    X.globalAlpha=0.35+Math.sin(gt*4)*0.15;
    const gr=X.createRadialGradient(sx,sy-12,3,sx,sy-12,22);
    gr.addColorStop(0,'#ffd54f');
    gr.addColorStop(0.6,'#ff8a00');
    gr.addColorStop(1,'rgba(255,138,0,0)');
    X.fillStyle=gr;
    X.beginPath();X.arc(sx,sy-12,22,0,Math.PI*2);X.fill();
    X.strokeStyle='#ffe082';X.lineWidth=1.5;
    for(let j=0;j<3;j++){
      X.beginPath();
      X.ellipse(sx,sy-12,15+j*5,6+j*2,gt*2+j,0,Math.PI*2);
      X.stroke();
    }
    X.restore();
  }

  // 彭罗斯标记
  if(p.type==='penrose'){
    X.save();
    X.globalAlpha=0.35;
    X.strokeStyle='#4dd0e1';X.lineWidth=2;
    const sz2=10;
    X.beginPath();
    X.moveTo(sx,sy-20-sz2);
    X.lineTo(sx+sz2,sy-20+sz2*0.6);
    X.lineTo(sx-sz2,sy-20+sz2*0.6);
    X.closePath();X.stroke();
    X.beginPath();
    X.moveTo(sx,sy-20-sz2*0.35);
    X.lineTo(sx+sz2*0.45,sy-20+sz2*0.25);
    X.lineTo(sx-sz2*0.45,sy-20+sz2*0.25);
    X.closePath();X.stroke();
    X.restore();
  }

  // 障碍物
  if(p.obs&&p.obsAct){
    const oy=sy-pillar*T*0.75-5;
    X.save();X.translate(sx,oy);
    if(p.obs==='spike'){
      X.save();X.rotate(gt*2);
      X.beginPath();
      for(let j=0;j<5;j++){
        const ang=(j*Math.PI*2)/5-Math.PI/2,iang=ang+Math.PI/5;
        if(j===0)X.moveTo(Math.cos(ang)*9,Math.sin(ang)*9);
        else X.lineTo(Math.cos(ang)*9,Math.sin(ang)*9);
        X.lineTo(Math.cos(iang)*3.5,Math.sin(iang)*3.5);
      }
      X.closePath();X.fillStyle='#ef5350';X.fill();
      X.strokeStyle='#c62828';X.lineWidth=1.5;X.stroke();
      X.restore();
    } else {
      X.save();X.rotate(gt);
      X.fillStyle='#ff7043';X.fillRect(-7,-7,14,14);
      X.strokeStyle='#d84315';X.lineWidth=1.5;X.strokeRect(-7,-7,14,14);
      X.strokeStyle='#fff';X.lineWidth=1.2;
      X.beginPath();X.moveTo(-3,-3);X.lineTo(3,3);X.moveTo(3,-3);X.lineTo(-3,3);X.stroke();
      X.restore();
    }
    X.restore();
  }

  // 星星
  if(p.star&&!p.starGot){
    const bob=Math.sin(gt*3+p.fOff)*3;
    const oy2=sy-pillar*T*0.75-18+bob;
    X.save();X.translate(sx,oy2);
    const gl=X.createRadialGradient(0,0,2,0,0,12);
    gl.addColorStop(0,'rgba(255,215,0,0.4)');
    gl.addColorStop(1,'rgba(255,215,0,0)');
    X.fillStyle=gl;X.beginPath();X.arc(0,0,12,0,Math.PI*2);X.fill();
    X.beginPath();
    for(let j=0;j<5;j++){
      const ang=(j*Math.PI*2)/5-Math.PI/2,iang=ang+Math.PI/5;
      if(j===0)X.moveTo(Math.cos(ang)*7,Math.sin(ang)*7);
      else X.lineTo(Math.cos(ang)*7,Math.sin(ang)*7);
      X.lineTo(Math.cos(iang)*3,Math.sin(iang)*3);
    }
    X.closePath();X.fillStyle='#ffd700';X.fill();
    X.strokeStyle='#ffa000';X.lineWidth=0.8;X.stroke();
    X.restore();
  }
}

// ===== 角色 =====
function drawChar(cx,cy){
  let gz=P.rz;
  if(P.falling) gz-=P.fallV*0.05;
  const pos=iso(P.rx,P.ry,gz);
  const sx=pos.x-cx, sy=pos.y-cy;

  X.save();X.translate(sx,sy);
  if(P.invT>0&&Math.floor(gt*10)%2===0)X.globalAlpha=0.4;
  if(P.hurt)X.translate(Math.sin(gt*50)*3,0);

  const bounce=P.moving?Math.sin(P.bodyB)*2.5:0;
  const legSw=P.moving?Math.sin(P.legA)*0.35:0;

  // 阴影
  X.save();X.globalAlpha=0.18;X.fillStyle='#000';
  X.beginPath();X.ellipse(0,6,12,5,0,0,Math.PI*2);X.fill();X.restore();

  X.translate(0,bounce-22);

  // 头
  X.beginPath();X.arc(0,-8,9,0,Math.PI*2);
  X.fillStyle='#2d8f4e';X.fill();X.strokeStyle='#1a5c32';X.lineWidth=1.8;X.stroke();

  // 身体交叉
  X.beginPath();
  X.moveTo(-3,1);
  X.quadraticCurveTo(-12,10,-5,17);
  X.quadraticCurveTo(2,23,9,30);
  X.lineTo(11,34);X.lineTo(5,34);
  X.quadraticCurveTo(0,27,-2,21);
  X.quadraticCurveTo(-7,27,-11,34);
  X.lineTo(-13,34);X.lineTo(-7,30);
  X.quadraticCurveTo(-2,23,3,17);
  X.quadraticCurveTo(11,10,3,1);
  X.closePath();
  X.fillStyle='#2d8f4e';X.fill();X.strokeStyle='#1a5c32';X.lineWidth=1.8;X.stroke();

  // 高光
  X.beginPath();
  X.moveTo(-1,3);X.quadraticCurveTo(-7,10,-2,15);
  X.quadraticCurveTo(0,13,1,10);X.quadraticCurveTo(7,6,1,3);
  X.closePath();X.fillStyle='rgba(58,181,100,0.35)';X.fill();

  // 白色点
  X.beginPath();X.ellipse(0,14,2.5,3.5,0,0,Math.PI*2);
  X.fillStyle='rgba(255,255,255,0.55)';X.fill();

  // 眼睛
  const ey=-12,bs=P.blink>0?Math.max(0.1,1-P.blink):1;
  X.beginPath();X.arc(-4.5,ey,5.5,0,Math.PI*2);X.arc(4.5,ey,5.5,0,Math.PI*2);
  X.fillStyle='#1a5c32';X.fill();
  X.beginPath();X.ellipse(-4.5,ey,4.5,4.5*bs,0,0,Math.PI*2);X.fillStyle='#fff';X.fill();
  X.beginPath();X.ellipse(4.5,ey,4.5,4.5*bs,0,0,Math.PI*2);X.fillStyle='#fff';X.fill();
  if(bs>0.3){
    const po=P.facing*1.2;
    X.beginPath();X.arc(-4.5+po,ey,2.2,0,Math.PI*2);X.fillStyle='#1a237e';X.fill();
    X.beginPath();X.arc(4.5+po,ey,2.2,0,Math.PI*2);X.fillStyle='#1a237e';X.fill();
  }
  X.beginPath();X.arc(0,-2,3.5,0.1*Math.PI,0.9*Math.PI);
  X.strokeStyle='#1a5c32';X.lineWidth=1.3;X.stroke();

  // 鞋
  for(let s of[-1,1]){
    X.save();X.translate(s*7,34);X.rotate(s*legSw);
    X.beginPath();X.ellipse(0,3.5,8,4.5,0,0,Math.PI*2);X.fillStyle='#2c2c2c';X.fill();
    X.beginPath();X.moveTo(-3.5,1.5);X.quadraticCurveTo(0,4,4.5,0.5);
    X.strokeStyle='#f5a623';X.lineWidth=1.5;X.stroke();
    X.restore();
  }

  X.restore();
}

// ===== 路径连线 =====
function drawConns(cx,cy){
  X.save();X.globalAlpha=0.12;X.strokeStyle='rgba(255,255,255,0.3)';X.lineWidth=1;
  X.setLineDash([3,4]);
  const s=Math.max(0,cur-2),e=Math.min(plats.length-1,cur+12);
  for(let i=s;i<e;i++){
    const a=plats[i],b=plats[i+1];
    if(!a||!b||!a.alive||!b.alive)continue;
    if(b.type==='illusion'||b.type==='fold')continue;
    const pa=iso(a.gx,a.gy,a.gz),pb=iso(b.gx,b.gy,b.gz);
    X.beginPath();X.moveTo(pa.x-cx,pa.y-cy);X.lineTo(pb.x-cx,pb.y-cy);X.stroke();
  }
  X.setLineDash([]);X.restore();
}

// ===== 粒子 =====
function addP(gx,gy,gz,col,n){
  for(let i=0;i<n;i++) particles.push({
    gx,gy,gz,vx:(Math.random()-0.5)*0.12,vy:(Math.random()-0.5)*0.12,vz:Math.random()*0.08+0.02,
    life:1,decay:0.02+Math.random()*0.02,color:col,size:2+Math.random()*2.5
  });
}
function addFloat(gx,gy,gz,txt,col){
  floats.push({gx,gy,gz,txt,col,life:1,vz:0.035});
}
function updateParts(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.gx+=p.vx;p.gy+=p.vy;p.gz+=p.vz;p.vz-=0.0015;
    p.life-=p.decay;if(p.life<=0)particles.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];f.gz+=f.vz;f.life-=0.016;if(f.life<=0)floats.splice(i,1);
  }
}
function drawParts(cx,cy){
  particles.forEach(p=>{
    const pos=iso(p.gx,p.gy,p.gz);
    X.globalAlpha=p.life;X.fillStyle=p.color;
    X.beginPath();X.arc(pos.x-cx,pos.y-cy,p.size,0,Math.PI*2);X.fill();
  });
  X.globalAlpha=1;
  floats.forEach(f=>{
    const pos=iso(f.gx,f.gy,f.gz);
    X.globalAlpha=f.life;X.fillStyle=f.col;
    X.font='bold 15px Arial';X.textAlign='center';
    X.fillText(f.txt,pos.x-cx,pos.y-cy);
  });
  X.globalAlpha=1;
}

// ===== 背景 =====
function drawBG(){
  const t=getTheme(cur);
  const gr=X.createLinearGradient(0,0,0,GH);
  gr.addColorStop(0,t.sky1);gr.addColorStop(1,t.sky2);
  X.fillStyle=gr;X.fillRect(0,0,GW,GH);

  // 星空
  X.fillStyle='rgba(255,255,255,0.25)';
  for(let i=0;i<60;i++){
    const fx2=(i*137.5+gt*3)%(GW+80)-40;
    const fy2=(i*97.3+Math.sin(gt*0.5+i)*15)%GH;
    const twk=Math.sin(gt*2+i*0.7)*0.3+0.5;
    X.globalAlpha=twk*0.35;
    X.beginPath();X.arc(fx2,fy2,(i%3)+0.8,0,Math.PI*2);X.fill();
  }
  X.globalAlpha=1;

  // 远景建筑剪影
  X.save();X.globalAlpha=0.05;
  drawCube(60-camTgt.x*0.01,280,3,3,5,'#888','#555','#444',0.05);
  drawCube(350+camTgt.y*0.01,240,2,2,7,'#888','#555','#444',0.04);
  X.restore();
}

// ===== UI（深色背景+高对比度） =====
function drawUI(){
  // 顶部深色面板
  X.fillStyle='rgba(0,0,0,0.55)';
  X.beginPath();
  roundRect(X,0,0,GW,60,0);
  X.fill();

  // 分数居中
  X.fillStyle='#fff';X.font='bold 24px Arial';X.textAlign='center';
  X.fillText(`⭐ ${score}`,GW/2,40);

  // 层级左侧
  X.fillStyle='rgba(255,255,255,0.8)';X.font='bold 13px Arial';
  X.textAlign='left';X.fillText(`🏔 第 ${cur} 级`,16,38);

  // 最高分右侧
  X.textAlign='right';X.fillText(`👑 ${best}`,GW-16,38);

  // Combo
  if(P.combo>1){
    X.save();
    X.globalAlpha=Math.min(1,P.comboT/30);
    X.fillStyle='rgba(0,0,0,0.4)';
    X.beginPath();roundRect(X,GW/2-55,64,110,26,13);X.fill();
    X.fillStyle='#ffd740';X.font='bold 15px Arial';X.textAlign='center';
    X.fillText(`COMBO x${P.combo}`,GW/2,82);
    X.restore();
  }

  // 下一平台类型提示
  if(cur+1<plats.length){
    const np=plats[cur+1];
    let hint='';
    if(np.type==='illusion') hint='✨ 视错觉通道';
    else if(np.type==='fold') hint='🌀 空间折叠';
    else if(np.type==='penrose') hint='♾️ 彭罗斯阶梯';
    else if(np.type==='crumble') hint='⚠️ 碎裂平台';
    else if(np.type==='float') hint='☁️ 漂浮平台';
    if(hint){
      X.fillStyle='rgba(0,0,0,0.5)';
      X.beginPath();roundRect(X,GW/2-85,GH-52,170,32,16);X.fill();
      X.fillStyle='#fff';X.font='bold 13px Arial';X.textAlign='center';
      X.fillText(hint,GW/2,GH-31);
    }
  }

  // 新手提示
  if(cur<3&&state===ST.PLAY){
    X.globalAlpha=0.6+Math.sin(gt*3)*0.3;
    X.fillStyle='rgba(0,0,0,0.45)';
    X.beginPath();roundRect(X,GW/2-95,GH-95,190,30,15);X.fill();
    X.fillStyle='#fff';X.font='14px Arial';X.textAlign='center';
    X.fillText('👆 长按屏幕前进',GW/2,GH-75);
    X.globalAlpha=1;
  }
}

// ===== 菜单 =====
function drawMenu(){
  const gr=X.createLinearGradient(0,0,0,GH);
  gr.addColorStop(0,'#2c1e4a');gr.addColorStop(0.5,'#1a1230');gr.addColorStop(1,'#0e0a1e');
  X.fillStyle=gr;X.fillRect(0,0,GW,GH);

  // 星空
  X.fillStyle='rgba(255,255,255,0.3)';
  for(let i=0;i<50;i++){
    const fx3=(i*131+gt*5)%(GW+60)-30;
    const fy3=(i*89+Math.sin(gt+i)*10)%GH;
    X.globalAlpha=Math.sin(gt*1.5+i)*0.2+0.3;
    X.beginPath();X.arc(fx3,fy3,(i%3)+0.5,0,Math.PI*2);X.fill();
  }
  X.globalAlpha=1;

  // 装饰方块
  X.save();X.globalAlpha=0.12;
  drawCube(80,220,2,2,2.5,'#c8b498','#9a8068','#887058',0.12);
  drawCube(310,200,1.5,2.5,3.5,'#98aac8','#687890','#586878',0.1);
  drawCube(190,380,2.5,1.5,1.5,'#a8c898','#789068','#688058',0.1);
  X.restore();

  // 标题
  X.fillStyle='#fff';X.font='bold 34px Arial';X.textAlign='center';
  X.fillText('不可能的阶梯',GW/2,145);
  X.fillStyle='rgba(255,255,255,0.45)';X.font='15px Arial';
  X.fillText('IMPOSSIBLE STAIRS',GW/2,172);

  // 角色
  drawMenuChar();

  X.fillStyle='rgba(255,255,255,0.55)';X.font='15px Arial';X.textAlign='center';
  X.fillText(`最高记录: ⭐ ${best}`,GW/2,415);

  // 开始按钮
  const bp2=Math.sin(gt*3)*3;
  X.fillStyle='#2d8f4e';
  X.beginPath();roundRect(X,GW/2-90,450-bp2,180,55,28);X.fill();
  // 按钮边框
  X.strokeStyle='rgba(255,255,255,0.2)';X.lineWidth=2;
  X.beginPath();roundRect(X,GW/2-90,450-bp2,180,55,28);X.stroke();
  X.fillStyle='#fff';X.font='bold 22px Arial';
  X.fillText('点击开始',GW/2,485-bp2);

  X.fillStyle='rgba(255,255,255,0.35)';X.font='12px Arial';
  X.fillText('长按屏幕 → 角色在等轴世界中前进',GW/2,545);
  X.fillText('躲避障碍 · 收集星星 · 探索不可能空间',GW/2,565);
}

function drawMenuChar(){
  X.save();X.translate(GW/2,305);
  const bb=Math.sin(gt*1.5)*2;
  X.translate(0,bb);
  // 简化绘制
  X.beginPath();X.arc(0,-8,9,0,Math.PI*2);X.fillStyle='#2d8f4e';X.fill();X.strokeStyle='#1a5c32';X.lineWidth=1.8;X.stroke();
  X.beginPath();
  X.moveTo(-3,1);X.quadraticCurveTo(-12,10,-5,17);X.quadraticCurveTo(2,23,9,30);
  X.lineTo(11,34);X.lineTo(5,34);X.quadraticCurveTo(0,27,-2,21);
  X.quadraticCurveTo(-7,27,-11,34);X.lineTo(-13,34);X.lineTo(-7,30);
  X.quadraticCurveTo(-2,23,3,17);X.quadraticCurveTo(11,10,3,1);X.closePath();
  X.fillStyle='#2d8f4e';X.fill();X.strokeStyle='#1a5c32';X.lineWidth=1.8;X.stroke();
  X.beginPath();X.ellipse(0,14,2.5,3.5,0,0,Math.PI*2);X.fillStyle='rgba(255,255,255,0.5)';X.fill();
  const bs2=P.blink>0?Math.max(0.1,1-P.blink):1;
  X.beginPath();X.arc(-4.5,-12,5.5,0,Math.PI*2);X.arc(4.5,-12,5.5,0,Math.PI*2);X.fillStyle='#1a5c32';X.fill();
  X.beginPath();X.ellipse(-4.5,-12,4.5,4.5*bs2,0,0,Math.PI*2);X.fillStyle='#fff';X.fill();
  X.beginPath();X.ellipse(4.5,-12,4.5,4.5*bs2,0,0,Math.PI*2);X.fillStyle='#fff';X.fill();
  if(bs2>0.3){
    X.beginPath();X.arc(-4.5,-12,2.2,0,Math.PI*2);X.fillStyle='#1a237e';X.fill();
    X.beginPath();X.arc(4.5,-12,2.2,0,Math.PI*2);X.fillStyle='#1a237e';X.fill();
  }
  X.beginPath();X.arc(0,-2,3.5,0.1*Math.PI,0.9*Math.PI);X.strokeStyle='#1a5c32';X.lineWidth=1.3;X.stroke();
  for(let s of[-1,1]){
    X.save();X.translate(s*7,34);
    X.beginPath();X.ellipse(0,3.5,8,4.5,0,0,Math.PI*2);X.fillStyle='#2c2c2c';X.fill();
    X.beginPath();X.moveTo(-3.5,1.5);X.quadraticCurveTo(0,4,4.5,0.5);X.strokeStyle='#f5a623';X.lineWidth=1.5;X.stroke();
    X.restore();
  }
  X.restore();
}

// ===== 结束画面 =====
function drawOver(){
  X.fillStyle='rgba(0,0,0,0.7)';X.fillRect(0,0,GW,GH);
  X.fillStyle='#ef5350';X.font='bold 36px Arial';X.textAlign='center';
  X.fillText('💀 坠落了',GW/2,240);
  X.fillStyle='#fff';X.font='20px Arial';
  X.fillText(`⭐ 得分: ${score}`,GW/2,300);
  X.fillText(`🏔 到达: 第 ${cur} 级`,GW/2,332);
  if(score>=best&&score>0){
    X.fillStyle='#ffd740';X.font='bold 18px Arial';
    X.fillText('🎉 新纪录！',GW/2,372);
  }
  const bp3=Math.sin(gt*3)*2;
  X.fillStyle='#2d8f4e';
  X.beginPath();roundRect(X,GW/2-80,415-bp3,160,50,25);X.fill();
  X.fillStyle='#fff';X.font='bold 20px Arial';
  X.fillText('再来一次',GW/2,447-bp3);
}

// ===== 逻辑 =====
function update(){
  gt+=1/60;
  if(state!==ST.PLAY) {
    // 菜单角色眨眼
    P.blinkT++;if(P.blinkT>180){P.blink=1;P.blinkT=0;}
    if(P.blink>0){P.blink-=0.12;if(P.blink<0)P.blink=0;}
    return;
  }

  P.blinkT++;if(P.blinkT>180+Math.random()*120){P.blink=1;P.blinkT=0;}
  if(P.blink>0){P.blink-=0.15;if(P.blink<0)P.blink=0;}
  if(P.invT>0)P.invT--;
  if(P.hurt){P.hurtT--;if(P.hurtT<=0)P.hurt=false;}
  if(P.comboT>0){P.comboT--;if(P.comboT<=0)P.combo=0;}

  if(P.falling){
    P.fallV+=0.12;P.rz-=P.fallV*0.04;
    if(P.fallV>25) gameOver();
    // 相机继续跟随
    const cp2=plats[cur];
    if(cp2){
      const pos2=iso(cp2.gx,cp2.gy,cp2.gz);
      camTgt.x=pos2.x-GW/2;camTgt.y=pos2.y-GH*0.45;
    }
    camOff.x+=(camTgt.x-camOff.x)*0.06;
    camOff.y+=(camTgt.y-camOff.y)*0.06;
    updateParts();
    return;
  }

  // 长按移动
  if(pressed&&!P.hurt){
    P.moving=true;P.legA+=0.25;P.bodyB+=0.2;

    const ni=cur+1;
    if(ni<plats.length){
      const np=plats[ni];
      if(!np.alive){P.falling=true;P.fallV=0;return;}

      let tgz=np.gz;
      if(np.type==='float') tgz+=Math.sin(gt*1.5+np.fOff)*0.3;

      const dx2=np.gx-P.rx, dy2=np.gy-P.ry, dz2=tgz-P.rz;
      const dist2=Math.sqrt(dx2*dx2+dy2*dy2+dz2*dz2);
      const spd2=0.08+Math.min(score*0.0002,0.025);

      if(dist2>spd2*1.5){
        const f=spd2/Math.max(dist2*0.25,0.3);
        P.rx+=dx2*f; P.ry+=dy2*f; P.rz+=dz2*f;
        if(dx2>0.1) P.facing=1; else if(dx2<-0.1) P.facing=-1;
      } else {
        P.rx=np.gx;P.ry=np.gy;P.rz=tgz;

        // 到达！
        cur=ni;np.visited=true;

        // 碎裂
        if(np.type==='crumble') np.crumT=0.1;

        // 计分
        let pts=1;
        if(np.type==='illusion'){pts=5;addFloat(np.gx,np.gy,np.gz+1,'视错觉 +5','#c080ff');}
        else if(np.type==='fold'){pts=8;addFloat(np.gx,np.gy,np.gz+1,'空间折叠 +8','#ffaa00');}
        else if(np.type==='penrose'){pts=6;addFloat(np.gx,np.gy,np.gz+1,'彭罗斯 +6','#4dd0e1');}
        else if(np.type==='float') pts=2;
        score+=pts;

        // 星星
        if(np.star&&!np.starGot){
          np.starGot=true;score+=5;
          P.combo++;P.comboT=120;
          addP(np.gx,np.gy,np.gz+0.5,'#ffd700',10);
          addFloat(np.gx,np.gy,np.gz+1.2,`+${5*Math.max(1,P.combo)}`,'#ffd700');
          if(P.combo>1) score+=(P.combo-1)*2;
        }

        // 障碍
        if(np.obs&&np.obsAct&&P.invT<=0){
          P.hurt=true;P.hurtT=25;P.invT=90;
          score=Math.max(0,score-5);np.obsAct=false;shakeT=12;
          addP(np.gx,np.gy,np.gz+0.5,'#ef5350',10);
          addFloat(np.gx,np.gy,np.gz+1,'-5','#ef5350');
          P.combo=0;
        }

        addP(np.gx,np.gy,np.gz,getTheme(cur).accent||'#7bed9f',4);
      }
    }
  } else {
    P.moving=false;
  }

  // 碎裂
  plats.forEach(p=>{
    if(p.type==='crumble'&&p.crumT>0&&p.crumT<50){
      p.crumT+=0.6;
      if(p.idx===cur&&p.crumT>18&&!P.falling){
        P.falling=true;P.fallV=0;
      }
    }
  });

  // 相机
  const cp3=plats[cur];
  if(cp3){
    const pos3=iso(cp3.gx,cp3.gy,cp3.gz);
    camTgt.x=pos3.x-GW/2;camTgt.y=pos3.y-GH*0.45;
  }
  camOff.x+=(camTgt.x-camOff.x)*0.06;
  camOff.y+=(camTgt.y-camOff.y)*0.06;
  if(shakeT>0) shakeT--;
  updateParts();
}

function gameOver(){
  state=ST.OVER;
  if(score>best){best=score;localStorage.setItem('isoBest2',best);}
  shakeT=15;addP(P.rx,P.ry,P.rz,'#ef5350',18);
}

function startGame(){
  state=ST.PLAY;score=0;cur=0;
  P.rx=0;P.ry=0;P.rz=0;
  P.moving=false;P.hurt=false;P.invT=0;P.combo=0;P.comboT=0;
  P.falling=false;P.fallV=0;P.facing=1;
  particles=[];floats=[];
  genPlats();
  const sp2=plats[0];
  P.rx=sp2.gx;P.ry=sp2.gy;P.rz=sp2.gz;
  const pos4=iso(sp2.gx,sp2.gy,sp2.gz);
  camOff.x=pos4.x-GW/2;camOff.y=pos4.y-GH*0.45;
  camTgt.x=camOff.x;camTgt.y=camOff.y;
}

// ===== 渲染 =====
function draw(){
  const shx=shakeT>0?(Math.random()-0.5)*shakeT*0.5:0;
  const shy=shakeT>0?(Math.random()-0.5)*shakeT*0.5:0;
  X.save();X.translate(shx,shy);

  if(state===ST.MENU){
    drawMenu();
  } else {
    drawBG();

    // 收集可见平台并排序
    const vis=[];
    const si=Math.max(0,cur-6), ei=Math.min(plats.length,cur+25);
    for(let i=si;i<ei;i++){
      if(plats[i]&&plats[i].alive) vis.push(plats[i]);
    }
    vis.sort((a,b)=>(a.gx+a.gy-a.gz)-(b.gx+b.gy-b.gz));

    drawConns(camOff.x,camOff.y);

    const cd=P.rx+P.ry-P.rz;
    let drawn=false;
    vis.forEach(p=>{
      const pd=p.gx+p.gy-p.gz;
      if(!drawn&&cd<=pd){drawChar(camOff.x,camOff.y);drawn=true;}
      drawPlat(p,camOff.x,camOff.y);
    });
    if(!drawn) drawChar(camOff.x,camOff.y);

    drawParts(camOff.x,camOff.y);
    drawUI();
    if(state===ST.OVER) drawOver();
  }
  X.restore();
}

function loop(){update();draw();requestAnimationFrame(loop);}

// ===== 输入 =====
function onDown(e){e.preventDefault();pressed=true;
  if(state===ST.MENU)startGame();
  else if(state===ST.OVER)startGame();
}
function onUp(e){e.preventDefault();pressed=false;}
C.addEventListener('mousedown',onDown);
C.addEventListener('mouseup',onUp);
C.addEventListener('mouseleave',onUp);
C.addEventListener('touchstart',onDown,{passive:false});
C.addEventListener('touchend',onUp,{passive:false});
C.addEventListener('touchcancel',onUp,{passive:false});
C.addEventListener('contextmenu',e=>e.preventDefault());

// ===== 工具 =====
function lighten(hex,amt){
  let r,g,b;
  if(hex[0]==='#'){r=parseInt(hex.slice(1,3),16);g=parseInt(hex.slice(3,5),16);b=parseInt(hex.slice(5,7),16);}
  else return hex;
  return `rgb(${Math.min(255,r+amt)},${Math.min(255,g+amt)},${Math.min(255,b+amt)})`;
}
function roundRect(ctx,x,y,w,h,r){
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}

loop();
</script>
