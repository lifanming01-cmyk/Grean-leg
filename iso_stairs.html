<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>绿色小人·不可能的阶梯</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{background:#2c1e4a;display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;overflow:hidden;font-family:'Arial',sans-serif}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');

// ===== 画布自适应 =====
const GW=420,GH=760;
let sc=1;
function resize(){
  const r1=innerWidth/innerHeight,r2=GW/GH;
  sc=r1<r2?innerWidth/GW:innerHeight/GH;
  C.width=GW*sc;C.height=GH*sc;
  X.setTransform(sc,0,0,sc,0,0);
}
resize();addEventListener('resize',resize);

// ===== 等轴测投影 =====
// 经典 2:1 等轴测
const ISO_ANGLE = Math.PI/6; // 30度
const TILE = 52; // 基础格子大小

function isoProject(gx, gy, gz) {
  // gx = 网格x, gy = 网格y(深度), gz = 高度
  const px = (gx - gy) * TILE * Math.cos(ISO_ANGLE);
  const py = (gx + gy) * TILE * Math.sin(ISO_ANGLE) - gz * TILE * 0.8;
  return { x: GW/2 + px, y: GH*0.75 + py };
}

// ===== 游戏状态 =====
const ST={MENU:0,PLAY:1,OVER:2};
let state=ST.MENU, score=0, best=+localStorage.getItem('isoStairBest')||0;
let pressed=false, gt=0, camOff={x:0,y:0}, camTarget={x:0,y:0};
let shakeT=0, particles=[], floats=[];

// ===== 平台数据 =====
let platforms=[];   // 每个平台 {gx, gy, gz, w, d, type, color, ...}
let curPlat=0;      // 当前所在平台索引
let nextToGenerate=0;

// 平台类型
const PLAT_NORMAL='normal';
const PLAT_NARROW='narrow';
const PLAT_WIDE='wide';
const PLAT_ILLU='illusion';     // 视错觉：看起来不连通但其实连通
const PLAT_FOLD='fold';         // 空间折叠：跳到远处
const PLAT_PENROSE='penrose';   // 彭罗斯阶梯：循环
const PLAT_FLOAT='float';       // 漂浮平台
const PLAT_CRUMBLE='crumble';   // 踩上就碎

// 颜色主题（纪念碑谷风）
const THEMES=[
  {top:'#f0e6d3',left:'#d4c4a8',right:'#c2b08a',accent:'#e8967a',sky1:'#ffecd2',sky2:'#fcb69f'},
  {top:'#d5e8d4',left:'#a3c4a2',right:'#8ab08a',accent:'#6b9e6b',sky1:'#d4fc79',sky2:'#96e6a1'},
  {top:'#dae2f8',left:'#aab6d6',right:'#8a9abe',accent:'#6c7eb7',sky1:'#a1c4fd',sky2:'#c2e9fb'},
  {top:'#f8d7da',left:'#d4a0a8',right:'#c28a94',accent:'#b06070',sky1:'#fbc2eb',sky2:'#a6c1ee'},
  {top:'#e8dff5',left:'#c4b0d6',right:'#a890be',accent:'#8b6aae',sky1:'#c471f5',sky2:'#fa71cd'},
];
let themeIdx=0, theme=THEMES[0];

// ===== 角色 =====
const P={
  gx:0, gy:0, gz:0,       // 网格坐标
  rx:0, ry:0, rz:0,       // 渲染坐标（平滑插值）
  moving:false,
  legAng:0, bodyBounce:0,
  blink:0, blinkT:0,
  facing:1,                // 1=前进方向
  hurt:false, hurtT:0,
  invT:0,
  combo:0, comboT:0,
  falling:false, fallV:0,
  onPlat:0
};

// ===== 平台生成 =====
function genPlatform(idx) {
  const prev = idx > 0 ? platforms[idx-1] : null;
  let gx, gy, gz, w=1, d=1, type=PLAT_NORMAL, special=null;
  let col = null;

  if (!prev) {
    // 起始平台
    gx=0; gy=0; gz=0; w=2; d=2; type=PLAT_WIDE;
  } else {
    // 随机方向：向右(gx+)或向前(gy+)，偶尔向上
    const difficulty = Math.min(idx / 80, 1);
    const r = Math.random();

    // 基础步长
    let dx=0, dy=0, dz=0;
    if (r < 0.45) {
      dx = 1 + Math.floor(Math.random() * (1 + difficulty));  // 向右
      dy = 0;
    } else if (r < 0.9) {
      dx = 0;
      dy = 1 + Math.floor(Math.random() * (1 + difficulty));  // 向前
    } else {
      // 对角
      dx = 1;
      dy = 1;
    }

    // 高度变化
    if (Math.random() < 0.35) {
      dz = Math.random() < 0.6 ? 1 : -1;
      if (prev.gz + dz < -2) dz = 1;
    }

    gx = prev.gx + dx;
    gy = prev.gy + dy;
    gz = prev.gz + dz;

    // 特殊平台类型
    if (idx > 5) {
      const tr = Math.random();
      if (tr < 0.08 * difficulty) {
        type = PLAT_CRUMBLE;
      } else if (tr < 0.14 * difficulty) {
        type = PLAT_NARROW;
        w = 1; d = 1;
      } else if (tr < 0.22 * difficulty) {
        type = PLAT_FLOAT;
      } else if (tr < 0.30 * difficulty && idx > 15) {
        type = PLAT_ILLU;
        // 视错觉：间隔大但实际可达
        if (dx > 0) dx += 2; else dy += 2;
        gx = prev.gx + dx;
        gy = prev.gy + dy;
        gz = prev.gz; // 保持同高
      } else if (tr < 0.38 * difficulty && idx > 20) {
        type = PLAT_FOLD;
        // 空间折叠：巨大跳跃
        dx = 3 + Math.floor(Math.random()*2);
        dy = 3 + Math.floor(Math.random()*2);
        dz = -2 + Math.floor(Math.random()*5);
        gx = prev.gx + dx;
        gy = prev.gy + dy;
        gz = prev.gz + dz;
        w = 2; d = 2;
      } else if (tr < 0.44 * difficulty && idx > 30) {
        type = PLAT_PENROSE;
        // 彭罗斯：回到较低位置但看起来在上升
        gz = prev.gz + 2;
        special = 'penrose';
      }
    }

    // 随机变宽
    if (type === PLAT_NORMAL && Math.random() < 0.2) {
      w = 2;
    }
    if (type === PLAT_NORMAL && Math.random() < 0.15) {
      d = 2;
    }
  }

  // 换主题
  if (idx > 0 && idx % 15 === 0) {
    themeIdx = (themeIdx + 1) % THEMES.length;
  }
  const t = THEMES[Math.floor(idx / 15) % THEMES.length];

  platforms[idx] = {
    gx, gy, gz, w, d, type, special,
    theme: t,
    alive: true,
    crumbleT: 0,
    floatOff: Math.random() * Math.PI * 2,
    visited: false,
    starX: Math.random() < 0.18 ? 0.5 : -1, // 星星位置
    starCollected: false,
    obstacle: (idx > 8 && type===PLAT_NORMAL && Math.random()<0.12*Math.min(1,difficulty||0.3)) ? 
      (Math.random()<0.5?'spike':'block') : null,
    obstacleActive: true,
    opacity: 1,
    spawnT: gt,
    idx: idx
  };
}

function ensurePlatforms() {
  while (platforms.length < curPlat + 40) {
    genPlatform(platforms.length);
  }
}

// ===== 绘制等轴测方块 =====
function drawIsoCube(cx, cy, w, d, h, topC, leftC, rightC, alpha) {
  // w,d 格子宽深, h 格子高
  const hw = w * TILE * Math.cos(ISO_ANGLE);
  const hd = d * TILE * Math.cos(ISO_ANGLE);
  const rise = h * TILE * 0.8;
  const halfW = w * TILE * Math.sin(ISO_ANGLE);
  const halfD = d * TILE * Math.sin(ISO_ANGLE);

  X.save();
  if (alpha !== undefined) X.globalAlpha = alpha;

  // 各顶点
  const top =    {x: cx,          y: cy};
  const right_ = {x: cx + hw,     y: cy + halfW};
  const bottom = {x: cx,          y: cy + halfW + halfD};
  const left_ =  {x: cx - hd,     y: cy + halfD};
  const topB =   {x: cx,          y: cy + rise};
  const rightB = {x: cx + hw,     y: cy + halfW + rise};
  const bottomB= {x: cx,          y: cy + halfW + halfD + rise};
  const leftB =  {x: cx - hd,     y: cy + halfD + rise};

  // 顶面
  X.beginPath();
  X.moveTo(top.x, top.y);
  X.lineTo(right_.x, right_.y);
  X.lineTo(bottom.x, bottom.y);
  X.lineTo(left_.x, left_.y);
  X.closePath();
  X.fillStyle = topC;
  X.fill();
  X.strokeStyle = 'rgba(0,0,0,0.08)';
  X.lineWidth = 1;
  X.stroke();

  // 左面
  X.beginPath();
  X.moveTo(left_.x, left_.y);
  X.lineTo(bottom.x, bottom.y);
  X.lineTo(bottomB.x, bottomB.y);
  X.lineTo(leftB.x, leftB.y);
  X.closePath();
  X.fillStyle = leftC;
  X.fill();
  X.strokeStyle = 'rgba(0,0,0,0.06)';
  X.stroke();

  // 右面
  X.beginPath();
  X.moveTo(right_.x, right_.y);
  X.lineTo(bottom.x, bottom.y);
  X.lineTo(bottomB.x, bottomB.y);
  X.lineTo(rightB.x, rightB.y);
  X.closePath();
  X.fillStyle = rightC;
  X.fill();
  X.strokeStyle = 'rgba(0,0,0,0.06)';
  X.stroke();

  X.restore();
}

// ===== 绘制平台 =====
function drawPlatform(p, camX, camY) {
  if (!p.alive) return;

  let gz = p.gz;
  // 漂浮动画
  if (p.type === PLAT_FLOAT) {
    gz += Math.sin(gt * 1.5 + p.floatOff) * 0.3;
  }

  const pos = isoProject(p.gx, p.gy, gz);
  const sx = pos.x - camX;
  const sy = pos.y - camY;

  // 屏幕外裁剪
  if (sx < -150 || sx > GW+150 || sy < -150 || sy > GH+150) return;

  let alpha = p.opacity;
  // 碎裂动画
  if (p.type === PLAT_CRUMBLE && p.crumbleT > 0) {
    alpha = Math.max(0, 1 - p.crumbleT / 40);
    if (p.crumbleT > 40) { p.alive = false; return; }
  }
  // 出场动画
  const age = gt - p.spawnT;
  if (age < 0.3) alpha *= age / 0.3;

  const t = p.theme;
  let topC = t.top, leftC = t.left, rightC = t.right;

  // 特殊类型染色
  if (p.type === PLAT_ILLU) {
    topC = '#e8c8ff'; leftC = '#c8a0e0'; rightC = '#b088c8';
  } else if (p.type === PLAT_FOLD) {
    topC = '#ffe0b2'; leftC = '#ffb74d'; rightC = '#f49d37';
  } else if (p.type === PLAT_PENROSE) {
    topC = '#b2ebf2'; leftC = '#80cbc4'; rightC = '#60a8a0';
  } else if (p.type === PLAT_CRUMBLE) {
    topC = '#ffcdd2'; leftC = '#ef9a9a'; rightC = '#e07070';
  } else if (p.type === PLAT_FLOAT) {
    topC = t.top; leftC = t.left; rightC = t.right;
  }

  // 当前平台高亮
  if (p.idx === curPlat) {
    topC = lighten(topC, 20);
  }
  // 下一个平台微光提示
  if (p.idx === curPlat + 1) {
    const pulse = Math.sin(gt * 4) * 0.15 + 0.85;
    alpha *= pulse;
  }

  const pillarH = 0.6 + (p.type === PLAT_FLOAT ? 0.3 : 0.4);
  drawIsoCube(sx, sy, p.w, p.d, pillarH, topC, leftC, rightC, alpha);

  // 视错觉连接线 - 虚幻桥梁
  if (p.type === PLAT_ILLU && p.idx > 0) {
    const prev = platforms[p.idx - 1];
    if (prev) {
      const pp = isoProject(prev.gx, prev.gy, prev.gz);
      const psx = pp.x - camX, psy = pp.y - camY;
      X.save();
      X.globalAlpha = 0.25 + Math.sin(gt * 3) * 0.15;
      X.setLineDash([6, 6]);
      X.strokeStyle = '#c080ff';
      X.lineWidth = 3;
      X.beginPath();
      X.moveTo(psx, psy);
      // 画一个弯曲的虚幻桥
      const mx = (psx + sx) / 2, my = (psy + sy) / 2 - 40;
      X.quadraticCurveTo(mx, my, sx, sy);
      X.stroke();
      X.setLineDash([]);
      // 虚幻粒子
      for (let i = 0; i < 3; i++) {
        const t2 = (gt * 0.5 + i * 0.33) % 1;
        const bx = psx + (sx - psx) * t2;
        const by = psy + (sy - psy) * t2 - Math.sin(t2 * Math.PI) * 40;
        X.fillStyle = `rgba(200,128,255,${0.6 - t2*0.6})`;
        X.beginPath();
        X.arc(bx, by, 3, 0, Math.PI * 2);
        X.fill();
      }
      X.restore();
    }
  }

  // 空间折叠 - 传送门效果
  if (p.type === PLAT_FOLD) {
    X.save();
    X.globalAlpha = 0.4 + Math.sin(gt * 5) * 0.2;
    const grad = X.createRadialGradient(sx, sy - 15, 3, sx, sy - 15, 25);
    grad.addColorStop(0, '#ffd54f');
    grad.addColorStop(0.5, '#ff8a00');
    grad.addColorStop(1, 'rgba(255,138,0,0)');
    X.fillStyle = grad;
    X.beginPath();
    X.arc(sx, sy - 15, 25, 0, Math.PI * 2);
    X.fill();
    // 旋转环
    X.strokeStyle = '#ffe082';
    X.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      X.beginPath();
      X.ellipse(sx, sy - 15, 18 + i * 5, 8 + i * 2, gt * 2 + i, 0, Math.PI * 2);
      X.stroke();
    }
    X.restore();
  }

  // 彭罗斯阶梯效果 - 不可能的楼梯图案
  if (p.type === PLAT_PENROSE) {
    X.save();
    X.globalAlpha = 0.3;
    // 画一个小的不可能三角形
    const cx2 = sx, cy2 = sy - 25;
    const sz = 12;
    X.strokeStyle = '#4dd0e1';
    X.lineWidth = 2.5;
    X.beginPath();
    // 彭罗斯三角简化
    X.moveTo(cx2, cy2 - sz);
    X.lineTo(cx2 + sz, cy2 + sz * 0.6);
    X.lineTo(cx2 - sz, cy2 + sz * 0.6);
    X.closePath();
    X.stroke();
    X.beginPath();
    X.moveTo(cx2, cy2 - sz * 0.4);
    X.lineTo(cx2 + sz * 0.5, cy2 + sz * 0.3);
    X.lineTo(cx2 - sz * 0.5, cy2 + sz * 0.3);
    X.closePath();
    X.stroke();
    X.restore();
  }

  // 障碍物
  if (p.obstacle && p.obstacleActive) {
    drawObstacle3D(sx, sy - pillarH * TILE * 0.8 + 5, p.obstacle);
  }

  // 星星
  if (p.starX > 0 && !p.starCollected) {
    drawStar3D(sx, sy - pillarH * TILE * 0.8 - 8);
  }
}

function drawObstacle3D(cx, cy, type) {
  X.save();
  X.translate(cx, cy - 10);
  if (type === 'spike') {
    X.rotate(gt * 2);
    X.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = (i * Math.PI * 2) / 5 - Math.PI / 2;
      const ia = a + Math.PI / 5;
      if (i === 0) X.moveTo(Math.cos(a)*10, Math.sin(a)*10);
      else X.lineTo(Math.cos(a)*10, Math.sin(a)*10);
      X.lineTo(Math.cos(ia)*4, Math.sin(ia)*4);
    }
    X.closePath();
    X.fillStyle = '#ef5350';
    X.fill();
    X.strokeStyle = '#c62828';
    X.lineWidth = 1.5;
    X.stroke();
  } else {
    X.rotate(gt);
    X.fillStyle = '#ff7043';
    X.fillRect(-8, -8, 16, 16);
    X.strokeStyle = '#d84315';
    X.lineWidth = 2;
    X.strokeRect(-8, -8, 16, 16);
    X.strokeStyle = '#fff';
    X.lineWidth = 1.5;
    X.beginPath();
    X.moveTo(-4,-4);X.lineTo(4,4);
    X.moveTo(4,-4);X.lineTo(-4,4);
    X.stroke();
  }
  X.restore();
}

function drawStar3D(cx, cy) {
  const bob = Math.sin(gt * 3) * 4;
  X.save();
  X.translate(cx, cy + bob - 14);
  // 发光
  const g = X.createRadialGradient(0, 0, 2, 0, 0, 14);
  g.addColorStop(0, 'rgba(255,215,0,0.5)');
  g.addColorStop(1, 'rgba(255,215,0,0)');
  X.fillStyle = g;
  X.beginPath(); X.arc(0, 0, 14, 0, Math.PI*2); X.fill();
  // 星
  X.beginPath();
  for (let i=0;i<5;i++){
    const a=(i*Math.PI*2)/5-Math.PI/2, ia=a+Math.PI/5;
    if(i===0) X.moveTo(Math.cos(a)*8,Math.sin(a)*8);
    else X.lineTo(Math.cos(a)*8,Math.sin(a)*8);
    X.lineTo(Math.cos(ia)*3.5,Math.sin(ia)*3.5);
  }
  X.closePath();
  X.fillStyle='#ffd700';X.fill();
  X.strokeStyle='#ffa000';X.lineWidth=1;X.stroke();
  if(Math.sin(gt*6)>0.7){X.fillStyle='#fff';X.beginPath();X.arc(-2,-2,2,0,Math.PI*2);X.fill();}
  X.restore();
}

// ===== 绘制角色（等轴测版） =====
function drawChar(camX, camY) {
  let gz = P.rz;
  if (P.falling) gz -= P.fallV * 0.5;

  const pos = isoProject(P.rx, P.ry, gz);
  const sx = pos.x - camX;
  const sy = pos.y - camY;

  X.save();
  X.translate(sx, sy);

  // 无敌闪烁
  if (P.invT > 0 && Math.floor(gt*10)%2===0) X.globalAlpha=0.4;
  // 受伤抖动
  if (P.hurt) X.translate(Math.sin(gt*50)*3, 0);

  const bounce = P.moving ? Math.sin(P.bodyBounce)*3 : 0;
  const legSw = P.moving ? Math.sin(P.legAng)*0.4 : 0;

  // 阴影
  X.save();
  X.globalAlpha = 0.15;
  X.fillStyle = '#000';
  X.beginPath();
  X.ellipse(0, 8, 14, 6, 0, 0, Math.PI * 2);
  X.fill();
  X.restore();

  X.translate(0, bounce - 24); // 角色偏移

  // ─── 身体（缎带交叉形） ───
  X.beginPath();
  X.arc(0, -8, 10, 0, Math.PI*2);
  X.fillStyle = '#2d8f4e'; X.fill();
  X.strokeStyle = '#1a5c32'; X.lineWidth=2; X.stroke();

  // 交叉身体
  X.beginPath();
  X.moveTo(-4, 2);
  X.quadraticCurveTo(-14, 12, -6, 20);
  X.quadraticCurveTo(2, 26, 10, 34);
  X.lineTo(12, 38); X.lineTo(6, 38);
  X.quadraticCurveTo(0, 30, -2, 24);
  X.quadraticCurveTo(-8, 30, -12, 38);
  X.lineTo(-14, 38); X.lineTo(-8, 34);
  X.quadraticCurveTo(-2, 26, 4, 20);
  X.quadraticCurveTo(12, 12, 4, 2);
  X.closePath();
  X.fillStyle='#2d8f4e';X.fill();
  X.strokeStyle='#1a5c32';X.lineWidth=2;X.stroke();

  // 身体高光
  X.beginPath();
  X.moveTo(-2, 4);
  X.quadraticCurveTo(-8, 12, -3, 18);
  X.quadraticCurveTo(0, 16, 2, 12);
  X.quadraticCurveTo(8, 8, 2, 4);
  X.closePath();
  X.fillStyle='rgba(58,181,100,0.4)';X.fill();

  // 白色装饰点
  X.beginPath();
  X.ellipse(0, 16, 3, 4, 0, 0, Math.PI*2);
  X.fillStyle='rgba(255,255,255,0.6)';X.fill();

  // ─── 眼睛 ───
  const ey = -12;
  const bs = P.blink > 0 ? Math.max(0.1, 1-P.blink) : 1;
  // 眼柄
  X.beginPath();X.arc(-5, ey-4, 6, 0, Math.PI*2);
  X.arc(5, ey-4, 6, 0, Math.PI*2);
  X.fillStyle='#1a5c32';X.fill();
  // 白眼球
  X.beginPath();X.ellipse(-5, ey-4, 5, 5*bs, 0, 0, Math.PI*2);
  X.fillStyle='#fff';X.fill();
  X.beginPath();X.ellipse(5, ey-4, 5, 5*bs, 0, 0, Math.PI*2);
  X.fillStyle='#fff';X.fill();
  // 蓝瞳
  if(bs>0.3){
    const po = P.facing * 1.5;
    X.beginPath();X.arc(-5+po, ey-4, 2.5, 0, Math.PI*2);
    X.fillStyle='#1a237e';X.fill();
    X.beginPath();X.arc(5+po, ey-4, 2.5, 0, Math.PI*2);
    X.fillStyle='#1a237e';X.fill();
  }
  // 微笑
  X.beginPath();X.arc(0, -2, 4, 0.1*Math.PI, 0.9*Math.PI);
  X.strokeStyle='#1a5c32';X.lineWidth=1.5;X.stroke();

  // ─── 鞋子 ───
  for (let side of [-1, 1]) {
    X.save();
    X.translate(side * 8, 38);
    X.rotate(side * legSw);
    X.beginPath(); X.ellipse(0, 4, 9, 5, 0, 0, Math.PI*2);
    X.fillStyle='#2c2c2c'; X.fill();
    X.beginPath(); X.ellipse(2, 2, 6, 3, 0, 0, Math.PI);
    X.fillStyle='#444'; X.fill();

}

// ===== 绘制背景 =====
function drawBG() {
  const ti = THEMES[Math.floor(curPlat / 15) % THEMES.length];
  const grad = X.createLinearGradient(0, 0, 0, GH);
  grad.addColorStop(0, ti.sky1);
  grad.addColorStop(1, ti.sky2);
  X.fillStyle = grad;
  X.fillRect(0, 0, GW, GH);

  // 远景装饰建筑（纪念碑谷风）
  X.save();
  X.globalAlpha = 0.08;
  // 远处的不可能建筑剪影
  const bx = GW * 0.15 - (camTarget.x * 0.02) % 50;
  const by = GH * 0.3;
  drawIsoCube(bx, by, 3, 3, 4, '#888', '#666', '#555', 0.08);
  drawIsoCube(GW * 0.8 + (camTarget.y * 0.02) % 50, by - 30, 2, 2, 6, '#888', '#666', '#555', 0.06);
  drawIsoCube(GW * 0.5, by + 40, 2, 4, 2, '#888', '#666', '#555', 0.05);
  X.restore();

  // 漂浮几何装饰
  X.save();
  X.globalAlpha = 0.06;
  for (let i = 0; i < 8; i++) {
    const fx = (i * 137.5 + gt * 8) % (GW + 100) - 50;
    const fy = (i * 97.3 + Math.sin(gt + i) * 20) % GH;
    X.strokeStyle = ti.accent || '#888';
    X.lineWidth = 1;
    X.beginPath();
    if (i % 3 === 0) {
      // 三角
      X.moveTo(fx, fy - 10);
      X.lineTo(fx + 10, fy + 8);
      X.lineTo(fx - 10, fy + 8);
      X.closePath();
    } else if (i % 3 === 1) {
      // 菱形
      X.moveTo(fx, fy - 8);
      X.lineTo(fx + 8, fy);
      X.lineTo(fx, fy + 8);
      X.lineTo(fx - 8, fy);
      X.closePath();
    } else {
      X.arc(fx, fy, 8, 0, Math.PI * 2);
    }
    X.stroke();
  }
  X.restore();
}

// ===== 绘制连接线（平台之间的虚线路径） =====
function drawConnections(camX, camY) {
  X.save();
  X.globalAlpha = 0.15;
  X.strokeStyle = '#888';
  X.lineWidth = 1;
  X.setLineDash([4, 4]);
  const start = Math.max(0, curPlat - 3);
  const end = Math.min(platforms.length - 1, curPlat + 15);
  for (let i = start; i < end; i++) {
    const a = platforms[i], b = platforms[i + 1];
    if (!a || !b || !a.alive || !b.alive) continue;
    if (b.type === PLAT_ILLU || b.type === PLAT_FOLD) continue; // 特殊类型有自己的连接
    const pa = isoProject(a.gx, a.gy, a.gz);
    const pb = isoProject(b.gx, b.gy, b.gz);
    X.beginPath();
    X.moveTo(pa.x - camX, pa.y - camY);
    X.lineTo(pb.x - camX, pb.y - camY);
    X.stroke();
  }
  X.setLineDash([]);
  X.restore();
}

// ===== 粒子 =====
function addP(x,y,gz,col,n){
  for(let i=0;i<n;i++) particles.push({
    gx:x,gy:y,gz:gz, vx:(Math.random()-0.5)*0.15, vy:(Math.random()-0.5)*0.15, vz:Math.random()*0.1+0.03,
    life:1, decay:0.02+Math.random()*0.02, color:col, size:2+Math.random()*3
  });
}
function addFloat(gx,gy,gz,txt,col){
  floats.push({gx,gy,gz,txt,col,life:1,vz:0.04});
}

function updateParticles(){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.gx+=p.vx;p.gy+=p.vy;p.gz+=p.vz;p.vz-=0.002;
    p.life-=p.decay;
    if(p.life<=0)particles.splice(i,1);
  }
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];
    f.gz+=f.vz;f.life-=0.018;
    if(f.life<=0)floats.splice(i,1);
  }
}

function drawParticles(camX,camY){
  particles.forEach(p=>{
    const pos=isoProject(p.gx,p.gy,p.gz);
    X.globalAlpha=p.life;
    X.fillStyle=p.color;
    X.beginPath();X.arc(pos.x-camX,pos.y-camY,p.size,0,Math.PI*2);X.fill();
  });
  X.globalAlpha=1;
  floats.forEach(f=>{
    const pos=isoProject(f.gx,f.gy,f.gz);
    X.globalAlpha=f.life;
    X.fillStyle=f.col;
    X.font='bold 16px Arial';X.textAlign='center';
    X.fillText(f.txt,pos.x-camX,pos.y-camY);
  });
  X.globalAlpha=1;
}

// ===== 核心逻辑 =====
function update(){
  gt += 1/60;
  if(state !== ST.PLAY) return;

  // 眨眼
  P.blinkT++;
  if(P.blinkT>180+Math.random()*120){P.blink=1;P.blinkT=0;}
  if(P.blink>0){P.blink-=0.15;if(P.blink<0)P.blink=0;}

  // 无敌/受伤
  if(P.invT>0)P.invT--;
  if(P.hurt){P.hurtT--;if(P.hurtT<=0)P.hurt=false;}
  if(P.comboT>0){P.comboT--;if(P.comboT<=0)P.combo=0;}

  // 掉落检测
  if(P.falling){
    P.fallV += 0.15;
    P.rz -= P.fallV * 0.05;
    if(P.fallV > 30) gameOver();
    return;
  }

  // 长按移动
  if(pressed && !P.hurt){
    P.moving = true;
    P.legAng += 0.25;
    P.bodyBounce += 0.2;

    const nextIdx = curPlat + 1;
    if(nextIdx < platforms.length){
      const np = platforms[nextIdx];
      if(!np.alive){
        // 平台已碎，掉落
        P.falling = true;
        P.fallV = 0;
        return;
      }

      let tgx = np.gx, tgy = np.gy, tgz = np.gz;
      if(np.type === PLAT_FLOAT) tgz += Math.sin(gt*1.5+np.floatOff)*0.3;

      // 平滑移动
      const dx = tgx - P.rx;
      const dy = tgy - P.ry;
      const dz = tgz - P.rz;
      const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);

      const spd = 0.06 + Math.min(score * 0.0003, 0.03);

      if(dist > spd){
        P.rx += dx * spd / Math.max(dist*0.3, 0.5);
        P.ry += dy * spd / Math.max(dist*0.3, 0.5);
        P.rz += dz * spd / Math.max(dist*0.3, 0.5);
        P.facing = dx > 0 ? 1 : dx < 0 ? -1 : P.facing;
      } else {
        P.rx = tgx; P.ry = tgy; P.rz = tgz;
        P.gx = tgx; P.gy = tgy; P.gz = tgz;

        // 到达新平台
        curPlat = nextIdx;
        np.visited = true;

        // 碎裂平台
        if(np.type === PLAT_CRUMBLE){
          np.crumbleT = 1; // 开始碎裂
          // 延迟碎裂
          setTimeout(()=>{ if(np.crumbleT>0) np.crumbleT = 2; }, 100);
        }

        // 计分
        let pts = 1;
        if(np.type === PLAT_ILLU) { pts = 5; addFloat(np.gx,np.gy,np.gz+1,'视错觉+5','#c080ff'); }
        else if(np.type === PLAT_FOLD) { pts = 8; addFloat(np.gx,np.gy,np.gz+1,'空间折叠+8','#ff8a00'); }
        else if(np.type === PLAT_PENROSE) { pts = 6; addFloat(np.gx,np.gy,np.gz+1,'彭罗斯+6','#4dd0e1'); }
        else if(np.type === PLAT_FLOAT) pts = 2;
        score += pts;

        // 星星
        if(np.starX > 0 && !np.starCollected){
          np.starCollected = true;
          score += 5;
          P.combo++;
          P.comboT = 120;
          addP(np.gx,np.gy,np.gz+0.5,'#ffd700',10);
          addFloat(np.gx,np.gy,np.gz+1.2,`+${5*Math.max(1,P.combo)}`,'#ffd700');
          if(P.combo>1) score += (P.combo-1)*2;
        }

        // 障碍物碰撞
        if(np.obstacle && np.obstacleActive && P.invT <= 0){
          P.hurt = true; P.hurtT = 25;
          P.invT = 90;
          score = Math.max(0, score - 5);
          np.obstacleActive = false;
          shakeT = 12;
          addP(np.gx,np.gy,np.gz+0.5,'#ef5350',12);
          addFloat(np.gx,np.gy,np.gz+1.2,'-5','#ef5350');
          P.combo = 0;
        }

        addP(np.gx,np.gy,np.gz,theme.accent||'#7bed9f',5);

        ensurePlatforms();
      }
    }
  } else {
    P.moving = false;
  }

  // 碎裂平台更新
  platforms.forEach(p => {
    if(p.type === PLAT_CRUMBLE && p.crumbleT > 0 && p.crumbleT < 50) {
      p.crumbleT += 0.5;
      if(p.idx === curPlat && p.crumbleT > 20 && !P.falling) {
        P.falling = true;
        P.fallV = 0;
      }
    }
  });

  // 相机跟随
  const cp = platforms[curPlat];
  if(cp){
    const pos = isoProject(cp.gx, cp.gy, cp.gz);
    camTarget.x = pos.x - GW/2;
    camTarget.y = pos.y - GH * 0.45;
  }
  camOff.x += (camTarget.x - camOff.x) * 0.06;
  camOff.y += (camTarget.y - camOff.y) * 0.06;

  // 震动
  if(shakeT > 0) shakeT--;

  updateParticles();
}

function gameOver(){
  state = ST.OVER;
  if(score > best){ best = score; localStorage.setItem('isoStairBest', best); }
  shakeT = 15;
  addP(P.rx, P.ry, P.rz, '#ef5350', 20);
}

function startGame(){
  state = ST.PLAY;
  score = 0; curPlat = 0;
  P.rx=0;P.ry=0;P.rz=0;P.gx=0;P.gy=0;P.gz=0;
  P.moving=false;P.hurt=false;P.invT=0;P.combo=0;P.comboT=0;
  P.falling=false;P.fallV=0;P.facing=1;
  particles=[];floats=[];
  platforms=[];
  themeIdx=0;theme=THEMES[0];
  genPlatform(0);
  ensurePlatforms();
  const sp=platforms[0];
  P.rx=sp.gx;P.ry=sp.gy;P.rz=sp.gz;
  P.gx=sp.gx;P.gy=sp.gy;P.gz=sp.gz;
  const pos=isoProject(sp.gx,sp.gy,sp.gz);
  camOff.x=pos.x-GW/2;camOff.y=pos.y-GH*0.45;
  camTarget.x=camOff.x;camTarget.y=camOff.y;
}

// ===== 渲染 =====
function draw(){
  const sx = shakeT>0?(Math.random()-0.5)*shakeT*0.6:0;
  const sy = shakeT>0?(Math.random()-0.5)*shakeT*0.6:0;

  X.save();
  X.translate(sx, sy);

  if(state===ST.MENU){
    drawMenu();
  } else {
    drawBG();

    // 渲染平台（按深度排序）
    const visible = [];
    const startI = Math.max(0, curPlat - 8);
    const endI = Math.min(platforms.length, curPlat + 30);
    for(let i = startI; i < endI; i++){
      if(platforms[i] && platforms[i].alive) visible.push(platforms[i]);
    }
    // 从远到近排序（等轴测深度排序）
    visible.sort((a,b) => {
      const da = a.gx + a.gy - a.gz;
      const db = b.gx + b.gy - b.gz;
      return da - db;
    });

    drawConnections(camOff.x, camOff.y);
    
    // 找角色插入位置（按深度）
    const charDepth = P.rx + P.ry - P.rz;
    let charDrawn = false;
    visible.forEach(p => {
      const pd = p.gx + p.gy - p.gz;
      if(!charDrawn && charDepth <= pd){
        drawChar(camOff.x, camOff.y);
        charDrawn = true;
      }
      drawPlatform(p, camOff.x, camOff.y);
    });
    if(!charDrawn) drawChar(camOff.x, camOff.y);

    drawParticles(camOff.x, camOff.y);
    drawUI();

    if(state===ST.OVER) drawOver();
  }
  X.restore();
}

function loop(){
  update();draw();requestAnimationFrame(loop);
}

// 工具函数
function lighten(hex, amt) {
  let r = parseInt(hex.slice(1,3),16);
  let g = parseInt(hex.slice(3,5),16);
  let b = parseInt(hex.slice(5,7),16);
  r = Math.min(255, r + amt);
  g = Math.min(255, g + amt);
  b = Math.min(255, b + amt);
  return `rgb(${r},${g},${b})`;
}

// roundRect polyfill
if (!X.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r) {
    if(typeof r==='number')r={tl:r,tr:r,br:r,bl:r};
    this.moveTo(x+r.tl,y);
    this.lineTo(x+w-r.tr,y);
    this.quadraticCurveTo(x+w,y,x+w,y+r.tr);
    this.lineTo(x+w,y+h-r.br);
    this.quadraticCurveTo(x+w,y+h,x+w-r.br,y+h);
    this.lineTo(x+r.bl,y+h);
    this.quadraticCurveTo(x,y+h,x,y+h-r.bl);
    this.lineTo(x,y+r.tl);
    this.quadraticCurveTo(x,y,x+r.tl,y);
    this.closePath();
  };
}

loop();
</script>
