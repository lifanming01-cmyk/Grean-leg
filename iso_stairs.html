<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>不可能的阶梯 v8</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
body{background:#0a0618;display:flex;justify-content:center;align-items:center;height:100vh;height:100dvh;overflow:hidden;font-family:'Arial',sans-serif}
canvas{display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* ================================================================
   不可能的阶梯 v8
   在 v7 连续地图 + 分叉选择 的基础上加入三大新机制:
   ① 视野受限 & 线索推理 — 分支只看前2格, 后面被迷雾遮盖
   ② 钥匙 & 宝箱 — 跨回合长线资源规划
   ③ 路径规划交互 — 玩家依次点击地块画出路线, 确认后角色逐步行走
   ================================================================ */

var C = document.getElementById('c');
var X = C.getContext('2d');
var GW = 420, GH = 780, sc = 1;

function resize() {
  var r = window.innerWidth / window.innerHeight, g = GW / GH;
  sc = r < g ? window.innerWidth / GW : window.innerHeight / GH;
  C.width = GW * sc; C.height = GH * sc;
  X.setTransform(sc, 0, 0, sc, 0, 0);
}
resize();
window.addEventListener('resize', resize);

// ====== 等轴投影 ======
var T = 55; // 拉近镜头(原30)
function iso(gx, gy, gz) {
  return {
    x: GW / 2 + (gx - gy) * T,
    y: GH * 0.45 + (gx + gy) * T * 0.5 - gz * T * 0.72
  };
}

// ====== 游戏状态 ======
var ST = {
  MENU: 0,    // 主菜单
  WALK: 1,    // 角色自动沿主路行走（到分叉点前）
  PLAN: 2,    // 【新】路径规划阶段 — 玩家在分支上依次点选地块画路线
  CONFIRM: 3, // 【新】路线已画好, 等玩家点"出发"确认
  EXEC: 4,    // 【新】角色沿玩家规划的路线逐步行走
  RESULT: 5,  // 结果展示
  OVER: 6     // 游戏结束
};
var state = ST.MENU;
var score = 0;
var best = 0; try { best = parseInt(localStorage.getItem('isoV8') || '0'); } catch(e) {}
var lives = 3;
var combo = 0;
var comboT = 0;
var step = 0;
var gt = 0;
var shakeT = 0;

// ====== 旧地块清理 ======
var forkHistory = []; // 记录每次分叉时的角色位置, 用于清理旧地块
var KEEP_FORKS = 2;   // 只保留最近N次分叉的地块

// ====== 【机制②】钥匙 & 宝箱 — 跨回合长线资源 ======
var keys = 0;          // 玩家持有的金钥匙数量
var chestsOpened = 0;  // 已开启宝箱数（纯统计）

// 相机
var camX = 0, camY = 0, camTX = 0, camTY = 0;

// 角色
var P = { gx: 0, gy: 0, gz: 0, facing: 1, bounce: 0 };
var walkQueue = [];  // 角色自动行走队列（主路段）
var walkSpeed = 0.07;
var walkT = 0;
var walkFrom = null;

// 【机制③】路径规划 — 玩家画的路线
var plannedPath = [];     // 玩家已选的地块序列 [{gx,gy,gz,tileRef}, ...]
var execQueue = [];       // 确认后的执行队列
var execT = 0;
var execFrom = null;
var execSpeed = 0.08;

// 结果
var resultT = 0;
var resultTxt = '';
var resultCol = '';

// ====== 地图数据 ======
var tiles = [];       // 所有地图方块
var mainPath = [];    // 当前主路段
var branches = [];    // 当前分叉选项
var branchStart = null;

// ====== 【机制①】视野受限 — 每个 tile 有 visible 属性 ======
// tile.foggy = true 表示被迷雾覆盖（只看到灰色轮廓）
// 分支的前 visibleRange 格可见, 后面 foggy

var visibleRange = 2; // 分支中前2格可见

// ====== 物品系统 ======
var ITEMS = {
  tree:     { emoji: '🌲', hint: 'good' },
  flower:   { emoji: '🌸', hint: 'good' },
  bush:     { emoji: '🍀', hint: 'good' },
  star:     { emoji: '⭐', hint: 'good' },
  gem:      { emoji: '💎', hint: 'good' },
  flag:     { emoji: '🚩', hint: 'good' },
  fountain: { emoji: '⛲', hint: 'good' },
  skull:    { emoji: '💀', hint: 'bad' },
  spike:    { emoji: '⚡', hint: 'bad' },
  fire:     { emoji: '🔥', hint: 'bad' },
  bat:      { emoji: '🦇', hint: 'bad' },
  web:      { emoji: '🕸️', hint: 'bad' },
  bone:     { emoji: '🦴', hint: 'bad' },
  crack:    { emoji: '⚠️', hint: 'bad' },
  mushroom: { emoji: '🍄', hint: 'neutral' },
  crystal:  { emoji: '🔮', hint: 'neutral' },
  rune:     { emoji: '🗿', hint: 'neutral' },
  // 【机制②】新增钥匙和宝箱
  key:      { emoji: '🔑', hint: 'key' },
  chest:    { emoji: '📦', hint: 'chest' }
};

var GOOD_ITEMS = ['tree','flower','bush','star','gem','flag','fountain'];
var BAD_ITEMS = ['skull','spike','fire','bat','web','bone','crack'];
var NEUTRAL_ITEMS = ['mushroom','crystal','rune'];

// 颜色主题
var THEME_SAFE =   [{ color:'#3a8a5c', topColor:'#4ca870' },{ color:'#3a7a8a', topColor:'#4c98a8' },{ color:'#5a7a3a', topColor:'#72984c' }];
var THEME_DANGER = [{ color:'#8a3a3a', topColor:'#a84c4c' },{ color:'#6a2a5a', topColor:'#883a72' },{ color:'#7a4a2a', topColor:'#985c3a' }];
var THEME_NEUTRAL =[{ color:'#5a5a6a', topColor:'#727282' }];
var THEME_FOG =     { color:'#3a3a4a', topColor:'#4a4a5a' }; // 迷雾格子的颜色
var THEME_KEY =     { color:'#8a7a20', topColor:'#a89830' }; // 钥匙路径
var THEME_CHEST =   { color:'#2a6a8a', topColor:'#3a82a8' }; // 宝箱路径

// 星空
var stars = [];
for (var i = 0; i < 70; i++) {
  stars.push({ x: Math.random() * GW, y: Math.random() * GH * 0.7, s: Math.random() * 1.5 + 0.3, sp: Math.random() * 0.008 + 0.003 });
}

// 粒子
var particles = [];
var floats = [];

// ====== 工具 ======
function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function shuffle(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

// ====== 地图生成 ======

function findTile(gx, gy, gz) {
  for (var i = 0; i < tiles.length; i++) {
    if (tiles[i].gx === gx && tiles[i].gy === gy && tiles[i].gz === gz) return tiles[i];
  }
  return null;
}

function addTile(gx, gy, gz, theme, foggy) {
  var exist = findTile(gx, gy, gz);
  if (exist) return exist;
  var t = {
    gx: gx, gy: gy, gz: gz,
    color: theme.color, topColor: theme.topColor,
    // 保存原始颜色, 迷雾揭开后恢复
    realColor: theme.color, realTopColor: theme.topColor,
    items: [],
    foggy: !!foggy,       // 【机制①】是否被迷雾遮盖
    revealed: false,      // 角色走过后揭开
    branchIdx: -1,        // 属于哪个分支(-1=主路)
    pathOrder: 0          // 在分支中的顺序(用于判断是否在可见范围内)
  };
  // 如果 foggy, 覆盖显示颜色为迷雾色
  if (t.foggy) {
    t.color = THEME_FOG.color;
    t.topColor = THEME_FOG.topColor;
  }
  tiles.push(t);
  return t;
}

function addItemToTile(tile, itemKey) {
  tile.items.push({ key: itemKey, emoji: ITEMS[itemKey].emoji, hint: ITEMS[itemKey].hint });
}

// 生成主路径(分叉点之间的安全直路)
function generateMainPath(sx, sy, sz, length) {
  var path = [];
  var gx = sx, gy = sy, gz = sz;
  var theme = randPick(THEME_SAFE);
  for (var i = 0; i < length; i++) {
    path.push({ gx: gx, gy: gy, gz: gz });
    var tile = addTile(gx, gy, gz, theme, false);
    tile.branchIdx = -1;
    // 主路上偶尔放小装饰
    if (i > 0 && Math.random() < 0.2) addItemToTile(tile, randPick(['tree','flower','bush']));
    // 随机方向, 总体上升
    var d = Math.random();
    if (d < 0.4) { gx++; gz++; }
    else if (d < 0.8) { gy++; gz++; }
    else { gx++; gy++; gz += 2; }
  }
  return path;
}

/*
 * 【核心】生成分支路径
 * 参数 type: 'safe'|'star'|'gold'|'crack'|'spike'|'void'|'key'|'chest'
 * 参数 direction: 'left'|'center'|'right'
 *
 * 【机制①】前 visibleRange 格正常显示, 后面的格子 foggy=true
 * 【机制②】type='key' 在末端放钥匙; type='chest' 在末端放宝箱
 */
function generateBranch(sx, sy, sz, type, direction, brIdx) {
  var path = [];
  var gx = sx, gy = sy, gz = sz;
  var length = 4 + Math.floor(Math.random() * 3); // 4-6格

  var isSafe = (type === 'safe' || type === 'star' || type === 'gold' || type === 'chest');
  var isKey = (type === 'key');
  var themePool;
  if (isKey) themePool = [THEME_KEY];
  else if (type === 'chest') themePool = [THEME_CHEST];
  else themePool = isSafe ? THEME_SAFE : THEME_DANGER;
  var theme = randPick(themePool);

  for (var i = 0; i < length; i++) {
    // 方向偏移
    if (direction === 'left') { gx++; gz++; if (i % 2 === 0) gy--; }
    else if (direction === 'right') { gy++; gz++; if (i % 2 === 0) gx--; }
    else { if (i % 2 === 0) { gx++; gz++; } else { gy++; gz++; } }

    // 【机制①】前 visibleRange 格可见, 后面迷雾
    var isFoggy = (i >= visibleRange);

    path.push({ gx: gx, gy: gy, gz: gz });
    var tile = addTile(gx, gy, gz, theme, isFoggy);
    tile.branchIdx = brIdx;
    tile.pathOrder = i;

    // 在可见格上放线索物品
    if (i < visibleRange && Math.random() < 0.6) {
      var itemPool;
      if (isKey) {
        // 钥匙路径: 前面放一些危险暗示, 暗示这条路有风险但也有宝
        itemPool = Math.random() < 0.5 ? BAD_ITEMS : NEUTRAL_ITEMS;
      } else if (type === 'chest') {
        itemPool = GOOD_ITEMS;
      } else if (isSafe) {
        itemPool = Math.random() < 0.7 ? GOOD_ITEMS : NEUTRAL_ITEMS;
      } else {
        itemPool = Math.random() < 0.65 ? BAD_ITEMS : NEUTRAL_ITEMS;
      }
      addItemToTile(tile, randPick(itemPool));
    }

    // 在迷雾格上也放物品(但玩家看不到, 走到才揭开)
    if (i >= visibleRange && Math.random() < 0.5) {
      if (isKey && i < length - 1) {
        // 钥匙路径中间: 混合危险和奖励
        addItemToTile(tile, Math.random() < 0.5 ? randPick(BAD_ITEMS) : randPick(GOOD_ITEMS));
      } else if (isSafe) {
        addItemToTile(tile, randPick(GOOD_ITEMS));
      } else {
        addItemToTile(tile, randPick(BAD_ITEMS));
      }
    }
  }

  // 末端放特殊物品
  var lastPt = path[path.length - 1];
  var lastTile = findTile(lastPt.gx, lastPt.gy, lastPt.gz);
  if (lastTile) {
    if (type === 'key') {
      addItemToTile(lastTile, 'key');   // 【机制②】钥匙
    } else if (type === 'chest') {
      addItemToTile(lastTile, 'chest'); // 【机制②】宝箱
    } else if (type === 'gold') {
      addItemToTile(lastTile, 'gem');
    } else if (type === 'star') {
      addItemToTile(lastTile, 'star');
    } else if (!isSafe) {
      addItemToTile(lastTile, 'skull');
    }
  }

  // 分支信息
  var reward = 0, label = '';
  switch(type) {
    case 'safe':  reward = 3;  label = '🌿 安全'; break;
    case 'star':  reward = 10; label = '⭐ 星星'; break;
    case 'gold':  reward = 25; label = '💎 宝石'; break;
    case 'crack': reward = -1; label = '💀 碎裂'; break;
    case 'spike': reward = -2; label = '⚡ 陷阱'; break;
    case 'void':  reward = -3; label = '🕳️ 深渊'; break;
    case 'key':   reward = -1; label = '🔑 钥匙'; break; // 拿钥匙有代价(扣血)
    case 'chest': reward = 0;  label = '📦 宝箱'; break;  // 宝箱本身不给分, 用钥匙开才给
  }

  return { path: path, type: type, reward: reward, label: label, direction: direction, brIdx: brIdx };
}

// 生成分叉点
function generateFork(sx, sy, sz) {
  var diff = Math.min(step / 10, 1);
  var numBr = Math.random() < 0.35 + diff * 0.15 ? 3 : 2;
  var dirs = numBr === 2 ? ['left','right'] : ['left','center','right'];

  var goodTypes = ['safe','star','gold'];
  var badTypes = ['crack','spike','void'];

  var types = [];
  // 至少一个好
  types.push(randPick(goodTypes));
  for (var i = 1; i < numBr; i++) {
    if (Math.random() < 0.25 + diff * 0.4) types.push(randPick(badTypes));
    else types.push(randPick(goodTypes));
  }

  // 【机制②】每隔几步, 有几率出现钥匙路径或宝箱路径
  if (step > 1 && Math.random() < 0.35) {
    // 替换其中一个分支为钥匙或宝箱
    var replaceIdx = Math.floor(Math.random() * types.length);
    if (keys === 0 || Math.random() < 0.5) {
      types[replaceIdx] = 'key'; // 生成钥匙路径
    } else {
      types[replaceIdx] = 'chest'; // 有钥匙时更可能出宝箱
    }
  }

  shuffle(types);

  branches = [];
  for (var i = 0; i < numBr; i++) {
    branches.push(generateBranch(sx, sy, sz, types[i], dirs[i], i));
  }
  branchStart = { gx: sx, gy: sy, gz: sz };
}

// ====== 关卡构建 ======
function buildLevel() {
  tiles = []; mainPath = []; branches = []; forkHistory = [];
  particles = []; floats = []; plannedPath = [];
  keys = 0; chestsOpened = 0;

  // 起点平台
  var st = THEME_SAFE[0];
  // 起点平台(tile变大后只需小平台)
  addTile(0, 0, 0, st, false);
  addTile(1, 0, 0, st, false);
  addTile(0, 1, 0, st, false);
  addTile(-1, 0, 0, st, false);
  addTile(0, -1, 0, st, false);

  // 第一段主路
  mainPath = generateMainPath(0, 0, 0, 5 + Math.floor(Math.random() * 3));

  // 末端分叉
  var last = mainPath[mainPath.length - 1];
  generateFork(last.gx, last.gy, last.gz);
}

function startGame() {
  state = ST.WALK;
  score = 0; lives = 3; combo = 0; comboT = 0; step = 0;
  keys = 0; chestsOpened = 0;
  P.gx = 0; P.gy = 0; P.gz = 0; P.facing = 1;
  plannedPath = [];

  buildLevel();

  // 让角色走到第一个分叉点
  walkQueue = [];
  for (var i = 1; i < mainPath.length; i++) walkQueue.push(mainPath[i]);
  walkT = 0;
  walkFrom = { gx: P.gx, gy: P.gy, gz: P.gz };
}

// ====== 绘制 ======

function drawTile(gx, gy, gz, color, topColor, ox, oy, scale) {
  var p = iso(gx, gy, gz);
  var sx = p.x - ox, sy = p.y - oy;
  var s = scale || 1;
  var hw = T * s, hh = T * 0.5 * s;
  var depth = T * 0.45 * s;

  // 顶面
  X.fillStyle = topColor;
  X.beginPath();
  X.moveTo(sx, sy - hh); X.lineTo(sx + hw, sy);
  X.lineTo(sx, sy + hh); X.lineTo(sx - hw, sy);
  X.closePath(); X.fill();

  // 左面
  X.fillStyle = color;
  X.beginPath();
  X.moveTo(sx - hw, sy); X.lineTo(sx, sy + hh);
  X.lineTo(sx, sy + hh + depth); X.lineTo(sx - hw, sy + depth);
  X.closePath(); X.fill();

  // 右面
  var rv = parseInt(color.slice(1,3),16), gv = parseInt(color.slice(3,5),16), bv = parseInt(color.slice(5,7),16);
  X.fillStyle = 'rgb('+Math.floor(rv*0.65)+','+Math.floor(gv*0.65)+','+Math.floor(bv*0.65)+')';
  X.beginPath();
  X.moveTo(sx + hw, sy); X.lineTo(sx, sy + hh);
  X.lineTo(sx, sy + hh + depth); X.lineTo(sx + hw, sy + depth);
  X.closePath(); X.fill();

  // 边缘高光
  X.strokeStyle = 'rgba(255,255,255,0.1)';
  X.lineWidth = 0.5;
  X.beginPath();
  X.moveTo(sx, sy - hh); X.lineTo(sx + hw, sy);
  X.lineTo(sx, sy + hh); X.lineTo(sx - hw, sy);
  X.closePath(); X.stroke();
}

function drawAllTiles(ox, oy) {
  var sorted = tiles.slice().sort(function(a, b) {
    return (a.gx + a.gy - a.gz) - (b.gx + b.gy - b.gz);
  });

  for (var i = 0; i < sorted.length; i++) {
    var t = sorted[i];
    drawTile(t.gx, t.gy, t.gz, t.color, t.topColor, ox, oy);

    var p = iso(t.gx, t.gy, t.gz);
    var sx = p.x - ox, sy = p.y - oy;

    // 【机制①】迷雾效果 — 在foggy格子上画半透明雾气
    if (t.foggy && !t.revealed) {
      X.save();
      X.globalAlpha = 0.55 + Math.sin(gt * 0.03 + t.gx + t.gy) * 0.15;
      X.fillStyle = '#2a2a3a';
      X.beginPath();
      X.moveTo(sx, sy - T * 0.5);
      X.lineTo(sx + T, sy);
      X.lineTo(sx, sy + T * 0.5);
      X.lineTo(sx - T, sy);
      X.closePath();
      X.fill();
      // 雾气问号
      X.globalAlpha = 0.6;
      X.fillStyle = '#888';
      X.font = 'bold 22px Arial'; // 迷雾问号放大
      X.textAlign = 'center';
      X.textBaseline = 'middle';
      X.fillText('?', sx, sy - 4);
      X.restore();
      continue; // foggy格不画物品
    }

    // 画物品(只在非foggy或已revealed时显示)
    if (t.items.length > 0 && (!t.foggy || t.revealed)) {
      for (var j = 0; j < t.items.length; j++) {
        var bob = Math.sin(gt * 0.05 + t.gx * 2 + t.gy * 3 + j) * 2;
        X.font = '17px Arial';
        X.textAlign = 'center'; X.textBaseline = 'middle';
        X.fillText(t.items[j].emoji, sx + (j - t.items.length/2 + 0.5) * 13, sy - 15 + bob);
      }
    }
  }
}

// 【机制③】绘制玩家规划的路线
function drawPlannedPath(ox, oy) {
  if (plannedPath.length === 0) return;

  X.save();

  // ---- 选中地块金色菱形描边高亮 ----
  for (var i = 0; i < plannedPath.length; i++) {
    var pp = iso(plannedPath[i].gx, plannedPath[i].gy, plannedPath[i].gz);
    var px = pp.x - ox, py = pp.y - oy;
    var hw = T, hh = T * 0.5;

    // 金色菱形外描边
    X.strokeStyle = '#ffdd44';
    X.lineWidth = 3;
    X.shadowColor = '#ffdd44';
    X.shadowBlur = 8;
    X.beginPath();
    X.moveTo(px, py - hh - 2);
    X.lineTo(px + hw + 2, py);
    X.lineTo(px, py + hh + 2);
    X.lineTo(px - hw - 2, py);
    X.closePath();
    X.stroke();
    X.shadowBlur = 0;

    // 半透明高亮覆盖
    X.fillStyle = 'rgba(255,220,60,0.12)';
    X.beginPath();
    X.moveTo(px, py - hh);
    X.lineTo(px + hw, py);
    X.lineTo(px, py + hh);
    X.lineTo(px - hw, py);
    X.closePath();
    X.fill();
  }

  // ---- 路径连线(发光) ----
  X.strokeStyle = 'rgba(255,220,80,0.7)';
  X.lineWidth = 3;
  X.shadowColor = '#ffdd44';
  X.shadowBlur = 6;
  X.setLineDash([8, 4]);
  X.beginPath();
  var sp = iso(P.gx, P.gy, P.gz);
  X.moveTo(sp.x - ox, sp.y - oy - 10);
  for (var i = 0; i < plannedPath.length; i++) {
    var pp = iso(plannedPath[i].gx, plannedPath[i].gy, plannedPath[i].gz);
    X.lineTo(pp.x - ox, pp.y - oy - 10);
  }
  X.stroke();
  X.setLineDash([]);
  X.shadowBlur = 0;

  // ---- 序号圆点(放大) ----
  for (var i = 0; i < plannedPath.length; i++) {
    var pp = iso(plannedPath[i].gx, plannedPath[i].gy, plannedPath[i].gz);
    var px = pp.x - ox, py = pp.y - oy - 10;

    // 外圈
    X.fillStyle = '#ffdd44';
    X.beginPath();
    X.arc(px, py, 14, 0, Math.PI * 2);
    X.fill();
    // 内圈
    X.fillStyle = '#332200';
    X.beginPath();
    X.arc(px, py, 11, 0, Math.PI * 2);
    X.fill();
    // 序号
    X.fillStyle = '#ffee88';
    X.font = 'bold 13px Arial';
    X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText('' + (i + 1), px, py);
  }

  // ---- 路径末端方向箭头(如果选了2+步) ----
  if (plannedPath.length >= 2) {
    var last = iso(plannedPath[plannedPath.length-1].gx, plannedPath[plannedPath.length-1].gy, plannedPath[plannedPath.length-1].gz);
    var prev = iso(plannedPath[plannedPath.length-2].gx, plannedPath[plannedPath.length-2].gy, plannedPath[plannedPath.length-2].gz);
    var ax = last.x - ox, ay = last.y - oy - 10;
    var dx = ax - (prev.x - ox), dy = ay - (prev.y - oy - 10);
    var len = Math.sqrt(dx*dx+dy*dy);
    if (len > 0) { dx/=len; dy/=len; }
    // 小三角箭头
    X.fillStyle = '#ffdd44';
    X.beginPath();
    X.moveTo(ax + dx*18, ay + dy*18);
    X.lineTo(ax + dx*8 - dy*7, ay + dy*8 + dx*7);
    X.lineTo(ax + dx*8 + dy*7, ay + dy*8 - dx*7);
    X.closePath();
    X.fill();
  }

  X.restore();
}

// 绘制分支入口标记(只在 PLAN 状态显示)
function drawBranchMarkers(ox, oy) {
  if (state !== ST.PLAN && state !== ST.CONFIRM) return;
  var labels = branches.length === 2 ? ['A','B'] : ['A','B','C'];

  for (var i = 0; i < branches.length; i++) {
    var br = branches[i];
    if (br.path.length === 0) continue;

    var firstPt = br.path[0];
    var fp = iso(firstPt.gx, firstPt.gy, firstPt.gz);
    var fx = fp.x - ox, fy = fp.y - oy;

    // ---- 呼吸灯脉冲(更大更亮) ----
    var pulse = 0.6 + Math.sin(gt * 0.07 + i * 2.2) * 0.4;
    var brType = br.type;
    var glowCol = (brType === 'key') ? '#ffd700' : (brType === 'chest') ? '#4488ff' : '#44ff88';

    X.save();
    // 外层大光晕
    X.globalAlpha = 0.18 * pulse;
    X.fillStyle = glowCol;
    X.beginPath();
    X.arc(fx, fy - 38, 38, 0, Math.PI * 2);
    X.fill();
    // 内层光晕
    X.globalAlpha = 0.25 * pulse;
    X.beginPath();
    X.arc(fx, fy - 38, 26, 0, Math.PI * 2);
    X.fill();
    X.restore();

    // ---- 标签圆(放大到 r=22) ----
    X.save();
    X.fillStyle = 'rgba(0,0,0,0.75)';
    X.strokeStyle = glowCol;
    X.lineWidth = 2.5;
    X.beginPath();
    X.arc(fx, fy - 38, 22, 0, Math.PI * 2);
    X.fill(); X.stroke();

    // 标签字母(放大)
    X.fillStyle = '#fff';
    X.font = 'bold 20px Arial';
    X.textAlign = 'center'; X.textBaseline = 'middle';
    X.fillText(labels[i], fx, fy - 38);
    X.restore();

    // ---- 分叉连线 ----
    if (branchStart) {
      var bsp = iso(branchStart.gx, branchStart.gy, branchStart.gz);
      X.save();
      X.strokeStyle = 'rgba(255,255,255,0.08)';
      X.lineWidth = 1;
      X.setLineDash([4, 5]);
      X.beginPath();
      X.moveTo(bsp.x - ox, bsp.y - oy - 10);
      X.lineTo(fx, fy - 10);
      X.stroke();
      X.setLineDash([]);
      X.restore();
    }
  }
}

// 绘制角色
function drawChar(ox, oy) {
  var gx = P.gx, gy = P.gy, gz = P.gz;

  // 行走插值
  if (state === ST.WALK && walkFrom && walkQueue.length > 0) {
    var to = walkQueue[0];
    gx = walkFrom.gx + (to.gx - walkFrom.gx) * walkT;
    gy = walkFrom.gy + (to.gy - walkFrom.gy) * walkT;
    gz = walkFrom.gz + (to.gz - walkFrom.gz) * walkT + Math.sin(walkT * Math.PI) * 0.3;
  }

  // 执行路线插值
  if (state === ST.EXEC && execFrom && execQueue.length > 0) {
    var to = execQueue[0];
    gx = execFrom.gx + (to.gx - execFrom.gx) * execT;
    gy = execFrom.gy + (to.gy - execFrom.gy) * execT;
    gz = execFrom.gz + (to.gz - execFrom.gz) * execT + Math.sin(execT * Math.PI) * 0.5;
  }

  var p = iso(gx, gy, gz);
  var sx = p.x - ox, sy = p.y - oy;
  var bob = Math.sin(P.bounce) * 1.5;
  var isMoving = (state === ST.WALK || state === ST.EXEC);

  X.save();
  X.translate(sx, sy - 18 + bob);
  var f = P.facing;

  // 影子
  X.globalAlpha = 0.25;
  X.fillStyle = '#000';
  X.beginPath(); X.ellipse(0, 16, 10, 4, 0, 0, Math.PI*2); X.fill();
  X.globalAlpha = 1;

  // 身体
  X.fillStyle = '#4ddb6a';
  X.beginPath(); X.ellipse(-4*f, -2, 8, 11, 0.15*f, 0, Math.PI*2); X.fill();
  X.beginPath(); X.ellipse(4*f, -2, 8, 11, -0.15*f, 0, Math.PI*2); X.fill();
  X.fillStyle = '#7aee92';
  X.beginPath(); X.ellipse(-2*f, -6, 3.5, 5.5, 0.15*f, 0, Math.PI*2); X.fill();

  // 眼睛
  X.fillStyle = '#fff';
  X.beginPath(); X.arc(-4*f, -7, 5, 0, Math.PI*2); X.fill();
  X.beginPath(); X.arc(4*f, -7, 5, 0, Math.PI*2); X.fill();
  X.fillStyle = '#2244cc';
  X.beginPath(); X.arc(-3*f, -7, 2.8, 0, Math.PI*2); X.fill();
  X.beginPath(); X.arc(5*f, -7, 2.8, 0, Math.PI*2); X.fill();
  X.fillStyle = '#fff';
  X.beginPath(); X.arc(-2*f, -8.5, 1, 0, Math.PI*2); X.fill();
  X.beginPath(); X.arc(6*f, -8.5, 1, 0, Math.PI*2); X.fill();

  // 鞋子
  var legA = isMoving ? Math.sin(gt * 0.3) * 3 : 0;
  X.fillStyle = '#222';
  X.beginPath(); X.ellipse(-4*f+legA, 13, 4.5, 3, 0, 0, Math.PI*2); X.fill();
  X.beginPath(); X.ellipse(4*f-legA, 13, 4.5, 3, 0, 0, Math.PI*2); X.fill();
  X.strokeStyle = '#f0c020'; X.lineWidth = 1;
  X.beginPath(); X.arc(-4*f+legA, 12, 2.5, 0.5, 2.5); X.stroke();
  X.beginPath(); X.arc(4*f-legA, 12, 2.5, 0.5, 2.5); X.stroke();

  X.restore();
}

// ====== UI ======
function roundRect(x, y, w, h, r) {
  X.beginPath();
  X.moveTo(x+r,y); X.lineTo(x+w-r,y);
  X.quadraticCurveTo(x+w,y,x+w,y+r); X.lineTo(x+w,y+h-r);
  X.quadraticCurveTo(x+w,y+h,x+w-r,y+h); X.lineTo(x+r,y+h);
  X.quadraticCurveTo(x,y+h,x,y+h-r); X.lineTo(x,y+r);
  X.quadraticCurveTo(x,y,x+r,y);
  X.closePath();
}

// 粒子
function addP(gx,gy,gz,col,n){for(var i=0;i<n;i++)particles.push({x:gx,y:gy,z:gz,vx:(Math.random()-0.5)*0.25,vy:(Math.random()-0.5)*0.25,vz:Math.random()*0.15+0.05,life:35+Math.random()*20,maxLife:55,color:col,size:Math.random()*2.5+1});}
function addFloat(gx,gy,gz,txt,col){floats.push({gx:gx,gy:gy,gz:gz,text:txt,color:col,life:55});}
function updateParts(){for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.x+=p.vx;p.y+=p.vy;p.z+=p.vz;p.vz-=0.004;p.life--;if(p.life<=0)particles.splice(i,1);}for(var i=floats.length-1;i>=0;i--){var f=floats[i];f.gz+=0.02;f.life--;if(f.life<=0)floats.splice(i,1);}}
function drawParts(ox,oy){for(var i=0;i<particles.length;i++){var p=particles[i],sp=iso(p.x,p.y,p.z);X.globalAlpha=p.life/p.maxLife;X.fillStyle=p.color;X.beginPath();X.arc(sp.x-ox,sp.y-oy,p.size,0,Math.PI*2);X.fill();}X.globalAlpha=1;for(var i=0;i<floats.length;i++){var f=floats[i],sp=iso(f.gx,f.gy,f.gz);X.globalAlpha=Math.min(1,f.life/15);X.fillStyle=f.color;X.font='bold 15px Arial';X.textAlign='center';X.fillText(f.text,sp.x-ox,sp.y-oy);}X.globalAlpha=1;}

// ====== 更新 ======
function update() {
  gt++;
  P.bounce += 0.07;
  if (comboT > 0) comboT--;
  if (comboT <= 0) combo = 0;

  // 自动行走(主路段)
  if (state === ST.WALK && walkQueue.length > 0) {
    walkT += walkSpeed;
    if (walkT >= 1) {
      var arrived = walkQueue.shift();
      P.gx = arrived.gx; P.gy = arrived.gy; P.gz = arrived.gz;
      P.facing = arrived.gx > (walkFrom ? walkFrom.gx : P.gx) ? 1 : -1;
      walkT = 0;
      walkFrom = { gx: P.gx, gy: P.gy, gz: P.gz };
      if (walkQueue.length === 0) {
        // 到达分叉点, 进入规划阶段
        state = ST.PLAN;
        plannedPath = [];
      }
    }
  }

  // 【机制③】执行规划路线 — 角色逐步行走, 每到一格结算
  if (state === ST.EXEC && execQueue.length > 0) {
    execT += execSpeed;
    if (execT >= 1) {
      var arrived = execQueue.shift();
      P.gx = arrived.gx; P.gy = arrived.gy; P.gz = arrived.gz;
      P.facing = arrived.gx > (execFrom ? execFrom.gx : P.gx) ? 1 : -1;
      execT = 0;
      execFrom = { gx: P.gx, gy: P.gy, gz: P.gz };

      // 【机制①】揭开迷雾 — 角色踩到的格子揭开真实颜色和物品
      var tile = findTile(P.gx, P.gy, P.gz);
      if (tile && tile.foggy && !tile.revealed) {
        tile.revealed = true;
        tile.color = tile.realColor;
        tile.topColor = tile.realTopColor;
        // 揭开动画
        addP(P.gx, P.gy, P.gz, '#aabbcc', 5);
      }

      // 逐步结算该格物品
      if (tile) {
        settleOneTile(tile);
      }

      // 走完了?
      if (execQueue.length === 0) {
        step++;
        finishBranch();
      }
    }
  }

  // 结果显示
  if (state === ST.RESULT) {
    resultT--;
    if (resultT <= 0) {
      if (lives <= 0) {
        state = ST.OVER;
        if (score > best) { best = score; try { localStorage.setItem('isoV8', best); } catch(e) {} }
      } else {
        // 生成下一段主路 + 新分叉
        prepareNext();
      }
    }
  }

  // 相机
  updateCamera();
  if (shakeT > 0) shakeT--;
  updateParts();
}

// 逐格结算
function settleOneTile(tile) {
  for (var i = 0; i < tile.items.length; i++) {
    var item = tile.items[i];
    switch(item.hint) {
      case 'good':
        var pts = 2 * (1 + Math.floor(combo / 3));
        score += pts;
        addFloat(tile.gx, tile.gy, tile.gz + 1, '+' + pts, '#44ff88');
        addP(tile.gx, tile.gy, tile.gz, '#44ff88', 3);
        break;
      case 'bad':
        // 单格上的bad物品: 小扣分, 不扣命(只有分支整体结果才扣命)
        score = Math.max(0, score - 1);
        addFloat(tile.gx, tile.gy, tile.gz + 1, '-1', '#ff6666');
        shakeT = 5;
        break;
      case 'key':
        // 【机制②】拾取钥匙!
        keys++;
        addFloat(tile.gx, tile.gy, tile.gz + 1.5, '🔑 获得钥匙!', '#ffd700');
        addP(tile.gx, tile.gy, tile.gz, '#ffd700', 12);
        break;
      case 'chest':
        // 【机制②】遇到宝箱
        if (keys > 0) {
          keys--;
          chestsOpened++;
          var chestPts = 50 * (1 + Math.floor(combo / 3));
          score += chestPts;
          addFloat(tile.gx, tile.gy, tile.gz + 1.5, '📦 开启! +' + chestPts, '#4488ff');
          addP(tile.gx, tile.gy, tile.gz, '#4488ff', 20);
        } else {
          addFloat(tile.gx, tile.gy, tile.gz + 1, '📦 需要🔑', '#888888');
        }
        break;
      case 'neutral':
        // 中性: 随机小奖或小罚
        if (Math.random() < 0.5) {
          score += 1;
          addFloat(tile.gx, tile.gy, tile.gz + 1, '+1', '#aaaacc');
        } else {
          addFloat(tile.gx, tile.gy, tile.gz + 1, '...', '#888888');
        }
        break;
    }
  }
}

// 分支走完后的总结算
var currentBranchType = '';
function finishBranch() {
  // 找到当前走的是哪个分支
  var br = null;
  for (var i = 0; i < branches.length; i++) {
    var brPath = branches[i].path;
    if (brPath.length > 0) {
      var lastBr = brPath[brPath.length - 1];
      if (lastBr.gx === P.gx && lastBr.gy === P.gy && lastBr.gz === P.gz) {
        br = branches[i]; break;
      }
    }
  }

  if (!br) {
    // 安全路径中间结束
    resultTxt = '🌿 安全通过!';
    resultCol = '#22ff66';
    combo++; comboT = 120;
    state = ST.RESULT; resultT = 40;
    return;
  }

  currentBranchType = br.type;
  var isSafe = (br.reward >= 0);

  if (br.type === 'key') {
    // 钥匙路径: 扣一条命, 但拿到了钥匙(在逐格结算中已拾取)
    lives--;
    shakeT = 15;
    resultTxt = '🔑 冒险获得钥匙! ❤️-1';
    resultCol = '#ffd700';
    combo = 0; comboT = 0;
    addP(P.gx, P.gy, P.gz, '#ffd700', 10);
  } else if (br.type === 'chest') {
    // 宝箱路径: 安全, 宝箱结算已在逐格中处理
    resultTxt = '📦 发现宝箱!';
    resultCol = '#4488ff';
    combo++; comboT = 120;
    addP(P.gx, P.gy, P.gz, '#4488ff', 10);
  } else if (isSafe) {
    var multi = 1 + Math.floor(combo / 3);
    var pts = br.reward * multi;
    score += pts;
    combo++; comboT = 120;
    resultTxt = br.label + ' +' + pts + '分!';
    resultCol = '#22ff66';
    addP(P.gx, P.gy, P.gz, '#44ff88', 12);
    addFloat(P.gx, P.gy, P.gz + 1, '+' + pts, '#44ff88');
  } else {
    lives--;
    combo = 0; comboT = 0; shakeT = 18;
    var penalty = Math.abs(br.reward) * 3;
    score = Math.max(0, score - penalty);
    resultTxt = br.label + '! ❤️-1 (-' + penalty + ')';
    resultCol = '#ff3344';
    addP(P.gx, P.gy, P.gz, '#ff4444', 16);
    addFloat(P.gx, P.gy, P.gz + 1, '-' + penalty, '#ff4444');
  }

  state = ST.RESULT;
  resultT = 50;
}

// 准备下一段路
function prepareNext() {
  // 记录本次分叉位置
  forkHistory.push({ gx: P.gx, gy: P.gy, gz: P.gz });

  // 【清理旧地块】删除 KEEP_FORKS 次之前的地块, 节省性能 & 保持画面干净
  if (forkHistory.length > KEEP_FORKS) {
    var oldFork = forkHistory[forkHistory.length - KEEP_FORKS - 1];
    // 删除所有在旧分叉点"下方"(gz 更低)的地块
    var cutZ = oldFork.gz;
    var newTiles = [];
    for (var i = 0; i < tiles.length; i++) {
      if (tiles[i].gz >= cutZ - 2) newTiles.push(tiles[i]); // 保留最近的
    }
    tiles = newTiles;
    // 同时裁剪 mainPath
    var newMain = [];
    for (var i = 0; i < mainPath.length; i++) {
      if (mainPath[i].gz >= cutZ - 2) newMain.push(mainPath[i]);
    }
    mainPath = newMain;
  }

  var extPath = generateMainPath(P.gx, P.gy, P.gz, 3 + Math.floor(Math.random() * 3));
  walkQueue = [];
  for (var i = 1; i < extPath.length; i++) {
    mainPath.push(extPath[i]);
    walkQueue.push(extPath[i]);
  }
  var last = extPath[extPath.length - 1];
  generateFork(last.gx, last.gy, last.gz);

  walkFrom = { gx: P.gx, gy: P.gy, gz: P.gz };
  walkT = 0;
  state = ST.WALK;
  plannedPath = [];
}

function updateCamera() {
  var cp = iso(P.gx, P.gy, P.gz);

  if (state === ST.WALK && walkFrom && walkQueue.length > 0) {
    var to = walkQueue[0];
    cp = iso(
      walkFrom.gx + (to.gx - walkFrom.gx) * walkT,
      walkFrom.gy + (to.gy - walkFrom.gy) * walkT,
      walkFrom.gz + (to.gz - walkFrom.gz) * walkT
    );
  }

  if (state === ST.EXEC && execFrom && execQueue.length > 0) {
    var to = execQueue[0];
    cp = iso(
      execFrom.gx + (to.gx - execFrom.gx) * execT,
      execFrom.gy + (to.gy - execFrom.gy) * execT,
      execFrom.gz + (to.gz - execFrom.gz) * execT
    );
  }

  // 规划阶段: 相机稍微拉远看到分支全貌
  if ((state === ST.PLAN || state === ST.CONFIRM) && branches.length > 0) {
    var avgX = 0, avgY = 0, cnt = 0;
    for (var i = 0; i < branches.length; i++) {
      var mid = branches[i].path[Math.min(1, branches[i].path.length - 1)];
      var mp = iso(mid.gx, mid.gy, mid.gz);
      avgX += mp.x; avgY += mp.y; cnt++;
    }
    var pp = iso(P.gx, P.gy, P.gz);
    cp = { x: (avgX/cnt + pp.x * 2) / 3, y: (avgY/cnt + pp.y * 2) / 3 };
  }

  camTX = cp.x - GW / 2;
  camTY = cp.y - GH * 0.35; // 镜头稍高，前方可见更多
  camX += (camTX - camX) * 0.05;
  camY += (camTY - camY) * 0.05;
}

// ====== 主绘制 ======
function draw() {
  var grad = X.createLinearGradient(0, 0, 0, GH);
  grad.addColorStop(0, '#0a0618');
  grad.addColorStop(0.4, '#10102a');
  grad.addColorStop(1, '#1a1535');
  X.fillStyle = grad; X.fillRect(0, 0, GW, GH);

  if (state === ST.MENU) { drawMenu(); return; }

  drawStars();

  var ox = camX, oy = camY;
  if (shakeT > 0) {
    ox += (Math.random()-0.5)*shakeT*1.2;
    oy += (Math.random()-0.5)*shakeT*1.2;
  }

  X.save();
  drawAllTiles(ox, oy);
  drawPlannedPath(ox, oy);
  drawChar(ox, oy);
  drawBranchMarkers(ox, oy);
  drawParts(ox, oy);
  X.restore();

  drawUI();
  drawResult();
  if (state === ST.OVER) drawOver();
}

function loop() { update(); draw(); window.requestAnimationFrame(loop); }

// ====== 【机制③】输入处理 — 路径规划交互 ======
function getPos(e) {
  var rect = C.getBoundingClientRect();
  var x, y;
  if (e.touches && e.touches.length > 0) {
    x = e.touches[0].clientX - rect.left; y = e.touches[0].clientY - rect.top;
  } else {
    x = e.clientX - rect.left; y = e.clientY - rect.top;
  }
  return { x: x / sc, y: y / sc };
}

function handleTap(x, y) {
  if (state === ST.MENU) { startGame(); return; }
  if (state === ST.OVER) { startGame(); return; }
  if (state === ST.WALK || state === ST.EXEC || state === ST.RESULT) return;

  if (state === ST.PLAN || state === ST.CONFIRM) {
    // 检查是否点了确认按钮
    if (plannedPath.length >= 2) {
      var bx = confirmBtnRect.x, by = confirmBtnRect.y;
      if (x >= bx && x <= bx + confirmBtnRect.w && y >= by && y <= by + confirmBtnRect.h) {
        confirmAndGo();
        return;
      }
    }

    // 检查点击了哪个地块
    var bestDist = 9999, bestTile = null;
    // 遍历所有分支地块
    for (var i = 0; i < branches.length; i++) {
      var br = branches[i];
      for (var j = 0; j < br.path.length; j++) {
        var pt = br.path[j];
        var p = iso(pt.gx, pt.gy, pt.gz);
        var dx = x - (p.x - camX), dy = y - (p.y - camY);
        var d = Math.sqrt(dx*dx + dy*dy);
        if (d < bestDist) {
          bestDist = d;
          bestTile = { gx: pt.gx, gy: pt.gy, gz: pt.gz, brIdx: i, pathIdx: j };
        }
      }
    }

    if (bestTile && bestDist < 40) {
      handleTileClick(bestTile);
    }
  }
}

/*
 * 【机制③】地块点击逻辑
 * 玩家依次点击地块来规划路线
 * 规则:
 *   - 第一步必须是某个分支的第一格(从分叉点出发)
 *   - 后续步必须是同一分支的下一格(顺序前进)
 *   - 点击已选的最后一格 = 撤销该步
 *   - 不能跨分支选择
 */
function handleTileClick(tileInfo) {
  var bIdx = tileInfo.brIdx;
  var pIdx = tileInfo.pathIdx;

  // 如果还没开始选, 只能选分支第一格
  if (plannedPath.length === 0) {
    if (pIdx === 0) {
      plannedPath.push(tileInfo);
      state = ST.PLAN;
    }
    return;
  }

  // 检查是否点了最后一步(撤销)
  var lastP = plannedPath[plannedPath.length - 1];
  if (lastP.gx === tileInfo.gx && lastP.gy === tileInfo.gy && lastP.gz === tileInfo.gz) {
    plannedPath.pop();
    if (plannedPath.length === 0) state = ST.PLAN;
    return;
  }

  // 必须是同一分支
  if (bIdx !== plannedPath[0].brIdx) return;

  // 必须是路径中的下一格
  var expectedIdx = plannedPath.length; // 因为第一步是pathIdx=0
  if (pIdx === expectedIdx) {
    plannedPath.push(tileInfo);
  }
}

/*
 * 【机制③】确认路线, 开始执行
 * 角色沿 plannedPath 逐步行走
 */
function confirmAndGo() {
  if (plannedPath.length < 2) return;
  
  execQueue = [];
  for (var i = 0; i < plannedPath.length; i++) {
    execQueue.push({ gx: plannedPath[i].gx, gy: plannedPath[i].gy, gz: plannedPath[i].gz });
  }
  execFrom = { gx: P.gx, gy: P.gy, gz: P.gz };
  execT = 0;
  state = ST.EXEC;
}

C.addEventListener('mousedown', function(e) { e.preventDefault(); var p = getPos(e); handleTap(p.x, p.y); });
C.addEventListener('touchstart', function(e) { e.preventDefault(); var p = getPos(e); handleTap(p.x, p.y); }, { passive: false });
C.addEventListener('contextmenu', function(e) { e.preventDefault(); });

loop();
</script>
